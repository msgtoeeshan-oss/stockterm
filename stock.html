function viewQuoteStrip(m){
  if(!m || m.price===null) return '';
  var c = cls(m.change);
  var dayBar = '';
  if(m.high!==null && m.low!==null && m.high>m.low){
    var p = clamp((m.price-m.low)/(m.high-m.low),0,1)*100;
    dayBar = '<div style="min-width:150px"><div class="lbl">Day range</div>' +
      '<div class="rangebar"><i style="left:'+p.toFixed(1)+'%"></i></div>' +
      '<div class="mono faint" style="font-size:9px;display:flex;justify-content:space-between;margin-top:2px">' +
      '<span>'+esc(px(m.low))+'</span><span>'+esc(px(m.high))+'</span></div></div>';
  }
  var wkBar = '';
  if(m.wk52High!==null && m.wk52Low!==null && m.wk52High>m.wk52Low){
    var p2 = clamp((m.price-m.wk52Low)/(m.wk52High-m.wk52Low),0,1)*100;
    wkBar = '<div style="min-width:150px"><div class="lbl">52-week range</div>' +
      '<div class="rangebar"><i style="left:'+p2.toFixed(1)+'%"></i></div>' +
      '<div class="mono faint" style="font-size:9px;display:flex;justify-content:space-between;margin-top:2px">' +
      '<span>'+esc(px(m.wk52Low))+'</span><span>'+esc(px(m.wk52High))+'</span></div></div>';
  }
  return '<section class="panel"><div class="quote">' +
    '<div><div class="q-sym">'+esc(State.ticker)+'</div>' +
      '<div class="dim" style="font-size:11.5px;max-width:230px">'+esc(m.name||'—')+'</div>' +
      '<div class="faint" style="font-size:9.5px;margin-top:1px">'+esc([m.exchange,m.industry].filter(Boolean).join(' · ')||'—')+'</div></div>' +
    '<div><div class="q-px '+c+'">'+esc(px(m.price,m.currency))+'</div>' +
      '<div class="q-ch '+c+'">'+esc(sgn(m.change,2))+' &nbsp;'+esc(pctS(m.changePct,2))+'</div></div>' +
    '<div class="q-meta">' +
      '<div><div class="lbl">Open</div><div class="v">'+esc(px(m.open))+'</div></div>' +
      '<div><div class="lbl">High</div><div class="v">'+esc(px(m.high))+'</div></div>' +
      '<div><div class="lbl">Low</div><div class="v">'+esc(px(m.low))+'</div></div>' +
      '<div><div class="lbl">Prev</div><div class="v">'+esc(px(m.prevClose))+'</div></div>' +
      '<div><div class="lbl">Mkt cap</div><div class="v">'+esc(money(m.marketCap,m.currency))+'</div></div>' +
      '<div><div class="lbl">P/E</div><div class="v">'+esc(m.pe===null?'--':fx(m.pe,1))+'</div></div>' +
    '</div>' + dayBar + wkBar +
    '<div class="sp"></div>' +
    '<div style="text-align:right">' +
      '<div class="lbl">Quote timestamp</div>' +
      '<div class="mono" style="font-size:10.5px">'+esc(tsFmt(m.quoteTime))+'</div>' +
      '<div class="mono ' + (isStale(m.quoteTime, 300) ? 'warn' : 'pos') + '" style="font-size:10.5px">' +
        esc(agoStr(m.quoteTime)) +
        (isStale(m.quoteTime, 300) ? ' — market likely closed' : ' — live') + '</div>' +
    '</div></div></section>';
}

/* Factor scores as a Finviz-style breadth strip. */
function viewBreadthStrip(m){
  var sig = runSignal(m, State.weights);
  var bars = sig.factors.map(function(f){
    return '<div>' + breadthBar(
      f.label, f.included ? f.score : null,
      f.included ? ('score ' + fx(f.score,0)) : (f.present + '/' + f.inputs + ' inputs'),
      'Shortfall', {mute: !f.included}
    ) + '</div>';
  }).join('');
  return '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:6px;margin:7px 0">' +
    bars + '</div>';
}

function viewMovers(){
  if(State.watchState==='loading')
    return '<div class="faint mono" style="font-size:10.5px;padding:10px"><span class="spin"></span> loading watchlist…</div>';
  if(!State.watch.length)
    return '<div class="faint mono" style="font-size:10.5px;padding:10px">Watchlist unavailable — the quote calls failed or were rate limited.</div>';
  return '<div class="scroll"><table class="tbl"><thead><tr>' +
    '<th>Ticker</th><th class="n">Last</th><th class="n">Change</th><th class="n">Open</th>' +
    '<th class="n">Range</th><th>Signal</th></tr></thead><tbody>' +
    State.watch.map(function(r){
      var sigTxt = r.chgPct===null ? '—'
        : r.chgPct >= 2 ? 'Top Gainer'
        : r.chgPct <= -2 ? 'Top Loser'
        : (r.rangePos!==null && r.rangePos>=85) ? 'Near day high'
        : (r.rangePos!==null && r.rangePos<=15) ? 'Near day low'
        : r.chgPct>0 ? 'Advancing' : 'Declining';
      var sc = r.chgPct===null ? 'faint' : (r.chgPct>=2?'pos':(r.chgPct<=-2?'neg':'dim'));
      return '<tr><td><a class="tk" href="#" data-act="chip" data-sym="'+attr(r.sym)+'">'+esc(r.sym)+'</a></td>' +
        '<td class="n">'+esc(px(r.price))+'</td>' +
        '<td class="n '+cls(r.chgPct)+'">'+esc(pctS(r.chgPct,2))+'</td>' +
        '<td class="n dim">'+esc(px(r.open))+'</td>' +
        '<td class="n dim">'+esc(r.rangePos===null?'--':fx(r.rangePos,0)+'%')+'</td>' +
        '<td class="'+sc+'">'+esc(sigTxt)+'</td></tr>';
    }).join('') + '</tbody></table></div>';
}

    ['Today',            pctS(m.changePct,2),           'move since yesterday’s close',       cls(m.changePct)],
    ['Company value',    money(m.marketCap,m.currency), 'price × all shares — what the market says it is worth', ''],
    ['Sales (year)',     money(m.revenueTTM,m.currency),'money coming in over the last 12 months', ''],
    ['Spare cash',       money(m.latestFcf,m.currency), 'cash left after running and maintaining the business', cls(m.latestFcf)],
    ['Price vs profit',  m.pe===null?'--':fx(m.pe,1)+'x','years of current profit to pay for the whole company (P/E)', ''],
    ['Cash return',      pct(m.fcfYield,2),             'spare cash as a % of company value — like an interest rate', cls(m.fcfYield)],
    ['Sales growth',     pctS(m.revGrowth,1),           'vs the same period last year',   cls(m.revGrowth)],

    ['Profit kept',      pct(m.netMargin,1),            'of every sales dollar, after everything', ''],

    ['Margin after running it',pct(m.opMargin,1),       'of every sales dollar, after wages, rent and R&D', ''],
    ['Getting better?',  m.marginTrend===null?'--':sgn(m.marginTrend,1)+'pp', 'change in operating margin across the whole record', cls(m.marginTrend)],
    ['Return on equity', pct(m.roe,1),                  'profit earned per dollar shareholders put in', ''],
    ['Return on capital',pct(m.roi,1),                  'profit earned per dollar of everything invested', ''],
    ['Debt vs equity',   m.de===null?'--':fx(m.de,2)+'x','below 1 means it owes less than owners put in', ''],
    ['Can it pay bills?',m.currentRatio===null?'--':fx(m.currentRatio,2)+'x','short-term assets per dollar of short-term bills', ''],

    ['Long-run growth',  pctS(m.revenueCagr,1),         m.years.length?('average yearly sales growth over '+m.years.length+' years'):'no history', cls(m.revenueCagr)],
    ['Earnings growth',  pctS(m.epsGrowth,1),           'profit per share vs the year before', cls(m.epsGrowth)],
    ['Price vs sales',   m.priceToSales===null?'--':fx(m.priceToSales,2)+'x','company value per dollar of annual sales (P/S)', ''],
    ['Price vs book',    m.pb===null?'--':fx(m.pb,2)+'x','company value per dollar of net assets (P/B)', ''],
    ['Dividend',         pct(m.divYield,2),             'cash paid to shareholders yearly, as a % of price', ''],

  var moreBtn = '<div class="row" style="margin-top:12px">' +

  /* Finnhub can return 15+ years; past ~12 the bars are too thin to read.

            grossMargin:y.grossMargin, opMargin:y.opMargin, netMargin:y.netMargin};

    '</span>';

  var histTable = hist.length ? '<div class="scroll"><table class="tbl"><thead><tr>' +

        }), histLbl) +

    '</div>' +

      panelT('Movers', viewMovers(),
        '<span class="faint mono" style="font-size:9.5px">'+State.watch.length+' symbols · click to analyze</span>') +

/* ---- SIGNAL ---- */
function signalBody(){
  var m = State.metrics; if(!m) return '';
  var sig = runSignal(m, State.weights);

  var head = '<div class="row" style="align-items:flex-end;gap:24px;margin-bottom:4px">' +
    '<div><div class="lbl">Composite</div>' +
      '<div class="num '+(sig.band?sig.band.cls:'faint')+'" style="font-size:40px;line-height:1;letter-spacing:-.035em">' +
      esc(sig.composite===null?'--':sig.composite.toFixed(1))+'</div></div>' +
    '<div><div class="lbl">Band</div><div style="margin-top:4px">' +
      (sig.band ? tag(sig.band.label, sig.band.cls) : tag('no score','')) + '</div></div>' +
    '<div><div class="lbl">Data coverage</div><div class="num" style="font-size:18px;margin-top:2px">' +
      esc(sig.coverage.toFixed(0))+'%<span class="faint" style="font-size:10.5px"> &nbsp;'+sig.inputsPresent+'/'+sig.inputsTotal+' inputs</span></div></div>' +
    '<div><div class="lbl">Factors in composite</div><div class="num" style="font-size:18px;margin-top:2px">' +
      sig.included+' / '+sig.factors.length +
      (sig.dropped?'<span class="warn" style="font-size:10.5px"> &nbsp;'+sig.dropped+' dropped</span>':'') + '</div></div>' +
    '</div>' +
    '<div class="faint" style="font-size:10.5px;line-height:1.5">' +
    'Band thresholds are your configured rules scoring themselves — not a recommendation. ' +
    'A factor with under half its inputs present is dropped from the composite and the remaining weights are renormalised, ' +
    'so absent data is never scored as a zero.</div>';

  var radar = radarChart(sig.factors.map(function(f){
    return {label:f.label.split(' ')[0].toUpperCase(), value: f.included ? f.score : null};
  }));

  var weightNote = sig.dropped ? note('Weights renormalised',
    '<div class="prose">' + esc(sig.factors.filter(function(f){return !f.included})
      .map(function(f){ return f.label + ' (' + f.present + '/' + f.inputs + ' inputs)'; }).join(', ')) +
    ' left the composite. The remaining factor weights were rescaled to sum to 100%.</div>', 'warn') : '';

  var traces = sig.factors.map(function(f){
    var effW = f.included && sig.included ? (function(){
      var t = sig.factors.filter(function(x){return x.included}).reduce(function(s,x){return s+x.weight},0);
      return t>0 ? f.weight/t*100 : 0;
    })() : 0;

    var rows = f.trace.map(function(r){
      var st = r.status==='hit'   ? '<span class="tag pos">hit</span>'
             : r.status==='miss'  ? '<span class="tag">miss</span>'
             : '<span class="tag warn">no data</span>';
      return '<tr'+(r.status==='nodata'?' class="off"':'')+'>' +
        '<td>'+esc(r.label)+'</td>' +
        '<td>'+st+'</td>' +
        '<td class="n">'+esc(r.value)+'</td>' +
        '<td class="n">'+(r.status==='nodata' ? '<span class="faint">excluded</span>'
            : '<span class="'+(r.earned?'pos':'faint')+'">'+r.earned+'</span><span class="faint"> / '+r.pts+'</span>')+'</td></tr>';
    }).join('');

    return '<section class="panel"><div class="panel-h">' +
      '<h2>'+esc(f.label)+'</h2>' +
      '<div class="row" style="gap:5px">' +
        (f.included ? tag('weight '+fx(effW,0)+'%','acc') : tag('excluded','warn')) +
        tag(f.present+'/'+f.inputs+' inputs', f.coverage>=50?'':'warn') +
        '<span class="num" style="font-size:16px">'+esc(f.score===null?'--':f.score.toFixed(1))+'</span>' +
      '</div></div><div class="panel-b tight">' +
      '<table class="tbl"><thead><tr><th>Rule</th><th>Result</th><th class="n">Value tested</th><th class="n">Points</th></tr></thead>' +
      '<tbody>'+rows+'</tbody></table>' +
      '<div class="row" style="justify-content:space-between;padding:6px 8px;border-top:1px solid var(--line-2)">' +
        '<span class="lbl">Earned / possible</span>' +
        '<span class="mono" style="font-size:11px">'+f.earned+' / '+f.possible +
        ' &nbsp;=&nbsp; <span class="acc">'+esc(f.score===null?'--':f.score.toFixed(1))+'</span></span></div>' +
      (f.capped ? '<div class="mono warn" style="font-size:9.5px;padding:0 8px 6px">' +
        'ceiling ' + fx(f.maxAchievable/f.possible*100,0) + ' — tiers on the same input are mutually exclusive, ' +
        'so ' + f.maxAchievable + '/' + f.possible + ' pts is the most any company can earn here</div>' : '') +
      (f.missing.length ? '<div class="mono faint" style="font-size:9.5px;padding:0 8px 6px">missing: '+esc(f.missing.join(', '))+'</div>' : '') +
      '</div></section>';
  }).join('');

  return '<div class="grid g32">' +
      panel('Composite', head) +
      panel('Factor radar', radar) +
    '</div>' + weightNote +
    '<div class="lbl" style="margin:12px 0 2px">Audit trace — every rule, whether it fired, the value it tested</div>' +
    '<div class="grid g2">'+traces+'</div>';
}
function viewSignal(m){
  var wSliders = Object.keys(CFG.DEF_WEIGHTS).map(function(k){
    var f = CFG.FACTORS.filter(function(x){return x.id===k})[0];
    return slider('weights', k, f.label, 0, 100, 1, State.weights[k], function(v){ return fx(v,0); });
  }).join('');

  return warnBlock(State.warnings) +
    panel('Factor weights',
      '<div class="grid g2">'+wSliders+'</div>' +
      '<div class="row" style="margin-top:6px">' + btn('resetWeights','Reset to 25 each','ghost') +
      '<span class="faint mono" style="font-size:9.5px">composite recomputes live</span></div>') +
    '<div data-live="signal">' + signalBody() + '</div>';
}

/* ---- VALUATION ---- */
function dcfBody(){
  var m = State.metrics; if(!m) return '';
  var d = runDcf(m, State.dcf);

  if(d.error) return note('DCF not computed', '<div class="prose">'+esc(d.error)+'</div>', 'neg');

  var mosCls = d.mos===null?'':(d.mos>0?'pos':'neg');
  var cards = '<div class="cards">' +
    card('Intrinsic value / share', px(d.perShare, m.currency), 'DCF, this assumption set', 'acc') +
    card('Current price', px(d.price, m.currency), 'live quote', '') +
    card('Margin of safety', d.mos===null?'--':pctS(d.mos,1), 'vs intrinsic value', mosCls) +
    card('Upside to fair value', d.upside===null?'--':pctS(d.upside,1), 'vs current price', mosCls) +
    card('Enterprise value', money(d.ev, m.currency), 'PV explicit + PV terminal', '') +
    card('Terminal value share', pct(d.tvShare,1), d.tvHot?'above 75% — see note':'of enterprise value', d.tvHot?'warn':'') +
    card('Starting FCF', money(d.fcf0, m.currency), m.latestFcfSource||'--', '') +
    card('Shares outstanding', money(d.shares), 'profile2 x 1e6', '') +
    '</div>';

  var tvNote = d.tvHot ? note('Terminal value is ' + fx(d.tvShare,1) + '% of enterprise value',
    '<div class="prose">Past roughly 75%, the valuation is driven by what happens after the forecast window rather than by the cash flows you actually modelled. ' +
    'You are pricing the terminal assumption, not the business. Lengthen the fade period or lower terminal growth to see how much of this holds up.</div>', 'warn') : '';

  var evNote = note('What this model does not include',
    '<div class="prose">Free cash flow is discounted to an enterprise value and divided straight by share count. ' +
    'There is no net-debt bridge — the endpoints used here do not return cash and total debt, so a company with large net debt will look better than it is, and one with a large net cash pile will look worse. ' +
    'Treat the per-share figure as enterprise value per share.</div>', '');

  var proj = d.rows.map(function(r){ return {label:'Y'+r.year, fcf:r.fcf, pv:r.pv}; });
  var chart = comboChart(proj, {
    bars:  [{key:'fcf', label:'Projected FCF', color:'--accent'}],
    lines: [{key:'pv',  label:'Present value', color:'--pos'}],
    fmtY: function(v){ return money(v); }, height:246, title:'projected free cash flow and present value'
  });

  var projTable = '<div class="scroll"><table class="tbl"><thead><tr>' +
    '<th>Year</th><th class="n">Growth</th><th class="n">FCF</th><th class="n">Discount factor</th><th class="n">PV</th></tr></thead><tbody>' +
    d.rows.map(function(r){
      var df = Math.pow(1+d.assumptions.discount/100, r.year);
      return '<tr><td>Y'+r.year+'</td><td class="n">'+esc(pct(r.growth,2))+'</td>' +
        '<td class="n">'+esc(money(r.fcf))+'</td><td class="n">'+esc(fx(1/df,3))+'</td>' +
        '<td class="n">'+esc(money(r.pv))+'</td></tr>';
    }).join('') +

      '<td class="n vio">'+esc(money(d.pvTv))+'</td></tr>' +
    '</tbody></table></div>';

  var g = sensitivityGrid(m, State.dcf);

    '<th style="text-align:left">Disc \\ term g</th>' +
    g.ts.map(function(t){ return '<th class="n" style="text-align:center">'+esc(fx(t,1))+'%</th>'; }).join('') +
    '</tr></thead><tbody>' +
    g.cells.map(function(row,i){
      return '<tr><td style="text-align:left;color:var(--dim);border:0">'+esc(fx(g.ds[i],1))+'%</td>' +
        row.map(function(c){

          var k = c.upside===null ? '' : (c.upside>20?'hi':(c.upside<-20?'lo':''));
          return '<td class="'+k+(c.cur?' cur':'')+'" title="'+attr('discount '+fx(c.d,1)+'%, terminal '+fx(c.t,1)+'% → '+px(c.value,m.currency)+' ('+pctS(c.upside,0)+' vs price)')+'">' +
            esc(px(c.value, m.currency)) + '<br><span style="font-size:9px;opacity:.75">'+esc(pctS(c.upside,0))+'</span></td>';
        }).join('') + '</tr>';
    }).join('') + '</tbody></table></div>' +
    '<div class="faint mono" style="font-size:9.5px;margin-top:6px">' +
    'Cell shows intrinsic value per share and change vs the current price. ' +
    'Green above +20%, red below −20%. Outlined cell is the live assumption set. ' +
    'Dashes are combinations where the discount rate does not exceed terminal growth.</div>';

  return cards + tvNote + evNote +
    '<div class="grid g2">' + panel('Projection', chart) + panelT('Cash flow schedule', projTable) + '</div>' +
    panel('Sensitivity — discount rate ±2 vs terminal growth ±1', sens);
}

/* ---- THESIS ---- */
/* Always-available written assessment, derived from the trace rather than
   from a model. Works offline and needs no second API. */
function viewLocalAssessment(m){
  var sig = runSignal(m, State.weights);
  var dcf = runDcf(m, State.dcf);
  var a = localAssessment(m, sig, dcf);

  /* Plain sentence first, the rule that produced it underneath in small type. */
  var lines = function(arr, mark){
    if(!arr.length) return '<div class="faint" style="font-size:11px;padding:2px">none</div>';
    return '<ul class="findings">' + arr.map(function(x){
      return '<li><span class="mk ' + mark + '">' + (mark==='y'?'✓':(mark==='n'?'✕':'–')) + '</span>' +
        '<span><span class="pl">'+esc(x.plain)+'</span>' +
        '<span class="tech">'+esc(x.rule)+' · now '+esc(x.value)+' · '+x.pts+' pts · '+esc(x.factor)+'</span></span></li>';
    }).join('') + '</ul>';
  };

  var band = sig.band ? sig.band.label : 'NO SCORE';
  var bandCls = sig.band ? sig.band.cls : '';
  var plainVerdict = sig.composite===null
    ? 'Not enough data came back to score ' + State.ticker + '.'
    : (sig.composite>=72 ? 'It passes most of the tests you set.'
     : sig.composite>=52 ? 'It passes the quality tests but not the price tests.'
     : sig.composite>=34 ? 'It fails more of your tests than it passes.'
     : 'It fails most of the tests you set.');

  /* Four bars turn a paragraph into a shape you can read in a second. */
  var fbars = '<div class="fbars">' + sig.factors.map(function(f){
    var v = f.included ? clamp(f.score,0,100) : null;
    var cl = v===null ? '' : (v>=70?'pos':(v>=45?'warn':'neg'));
    return '<div class="fbar">' +
      '<div class="fb-h"><span>'+esc(f.label)+'</span>' +
        '<span class="fb-v '+cl+'">'+(v===null?'n/a':fx(v,0))+'</span></div>' +
      '<div class="fb-t"><i class="'+cl+'" style="width:'+(v===null?0:v).toFixed(1)+'%"></i></div>' +
      (f.included ? '' : '<div class="fb-x">too little data</div>') +
    '</div>';
  }).join('') + '</div>';

  return '<div class="verdict">' +
      '<div class="vtop">' +
        '<div class="vscore ' + bandCls + '">' + esc(sig.composite===null?'--':sig.composite.toFixed(0)) +
          '<span>/100</span></div>' +
        '<div class="vtext">' +
          '<div class="vband">' + tag(band, bandCls) +
            '<span class="vplain">' + esc(plainVerdict) + '</span></div>' +
          '<div class="vsub">' + esc(a.headline) + '</div>' +
        '</div>' +
        '<div class="vmeta"><div class="lbl">Data coverage</div>' +
          '<div class="num" style="font-size:22px">' + esc(sig.coverage.toFixed(0)) + '%</div>' +
          '<div class="faint" style="font-size:10.5px">' + sig.inputsPresent + '/' + sig.inputsTotal + ' inputs</div></div>' +
      '</div>' + fbars +
    '</div>' +
    panel('What the price model says',
      '<div class="prose">'+esc(a.valuation)+'</div>',
      '<span class="faint mono" style="font-size:9.5px">derived from the trace · no model involved</span>') +
    '<div class="grid g2">' +
      panel('In its favour — ' + a.strengths.length + ' tests passed', lines(a.strengths, 'y')) +
      panel('Against it — ' + a.weaknesses.length + ' tests failed',
        lines(a.weaknesses, 'n') +
        (a.superseded.length
          ? '<div class="hr"></div><div class="lbl">Already beaten — not held against it</div>' +
            '<ul class="findings" style="margin-top:4px">' + a.superseded.map(function(x){
              return '<li><span class="mk o">–</span><span><span class="pl dim">'+esc(x.plain)+'</span>' +
                '<span class="tech">'+esc(x.rule)+' · it already passed a stricter version of this test</span></span></li>';
            }).join('') + '</ul>'
          : '')) +
    '</div>' +
    '<div class="grid g2">' +
      panel('What would move it most',
        (a.levers.length
          ? '<ul class="findings">' + a.levers.slice(0, State.showAll?12:4).map(function(x){
              return '<li><span class="mk o">→</span><span><span class="pl">'+esc(x.plain)+'</span>' +
                '<span class="tech">worth '+x.pts+' pts in '+esc(x.factor)+'</span></span></li>';
            }).join('') + '</ul>' +
            (a.levers.length>4 && !State.showAll
              ? '<div class="row" style="margin-top:10px">' +
                btn('toggleAll','Show '+(a.levers.length-4)+' more','ghost') + '</div>'
              : '')
          : '<div class="faint" style="font-size:11px">every test it can be scored on already passes</div>'),
        '<span class="faint mono" style="font-size:11px">ranked by points</span>') +
      panel('Data gaps',
        (a.gaps.length
          ? '<ul class="bullets prose">' + a.gaps.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('') + '</ul>'
          : '<div class="prose">No gaps: every input the rules need was present.</div>') +
        (a.notAssessed.length
          ? '<div class="faint mono" style="font-size:10px;margin-top:6px">Not assessed: ' +
            esc(a.notAssessed.map(function(x){ return x.text; }).join(' · ')) + '</div>'
          : '')) +
    '</div>';
}

/* Judge verdict. Overreaches are the point: a claim neither side could
   support is more informative than the argument it was used to win. */
function renderJudge(j){
  var side = String(j.betterSupported||'').toLowerCase();
  var sideTag = side==='bull' ? tag('bull better supported','pos')
              : side==='bear' ? tag('bear better supported','neg')
              : tag('evidence favours neither','warn');
  var over = asArr(j.overreaches).map(function(o){
    if(typeof o === 'string') return {side:'', claim:o, why:''};
    return {side:String((o&&o.side)||'').toLowerCase(), claim:(o&&o.claim)||'', why:(o&&o.why)||''};
  });
  return '<div class="hr"></div>' +
    '<div class="row" style="margin-bottom:10px">' + sideTag +
      (j.evidenceQuality ? '<span class="faint" style="font-size:11.5px">'+esc(j.evidenceQuality)+'</span>' : '') +
    '</div>' +
    '<div class="prose" style="font-size:14.5px;line-height:1.65">'+esc(j.verdict||'—')+'</div>' +
    '<div class="grid g2" style="margin-top:14px">' +
      '<div class="jbox pos"><div class="lbl">Strongest bull point</div>' +
        '<div class="prose">'+esc(j.strongestBullPoint||'—')+'</div></div>' +
      '<div class="jbox neg"><div class="lbl">Strongest bear point</div>' +
        '<div class="prose">'+esc(j.strongestBearPoint||'—')+'</div></div>' +
    '</div>' +
    (over.length
      ? '<div class="lbl" style="margin:16px 0 6px">Overreach — claimed without support in the sources</div>' +
        '<ul class="findings">' + over.map(function(o){
          return '<li><span class="mk n">!</span><span><span class="pl">'+esc(o.claim)+'</span>' +
            '<span class="tech">'+esc((o.side?o.side+' side · ':'')+(o.why||''))+'</span></span></li>';
        }).join('') + '</ul>'
      : '<div class="note acc" style="margin-top:14px"><b>No overreach found</b>' +
        '<div class="prose">The judge found every claim on both sides backed by a citation.</div></div>') +
    '<div class="grid g2" style="margin-top:6px">' +
      panel('Both sides missed', asArr(j.bothMissed).length ? bullets(j.bothMissed)
        : '<div class="prose">Nothing material in the sources went unused.</div>') +
      panel('The evidence cannot settle', asArr(j.unresolvable).length ? bullets(j.unresolvable)
        : '<div class="prose">No disagreement was left open.</div>') +
    '</div>' +
    (asArr(j.whatWouldSettleIt).length
      ? panel('What would settle it', bullets(j.whatWouldSettleIt)) : '');
}

function viewThesis(m){
  var localPart = viewLocalAssessment(m);

  if(!AI_KEY){
    return localPart + panel('Model thesis — optional',
      note('No model key set',
        '<div class="prose">This section additionally sends the computed metrics to ' + esc(CFG.AI_LABEL) + '. ' +
        'The assessment above does not need it.<br><br>To enable, open this file in a text editor, find ' +
        '<span class="mono acc">var AI_KEY</span> near the top of <b>section 1</b>, and paste a key from ' +
        '<a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer">aistudio.google.com/apikey</a> between the quotes.</div>', 'acc'));
  }

  var t = State.thesis;
  var curMode = CFG.MODES.filter(function(x){ return x.id===State.mode; })[0] || CFG.MODES[0];
  var modePicker = '<div class="lens">' +
      '<div class="lbl" style="margin-bottom:6px">Research mode — a fixed question set, answered in order</div>' +
      '<div class="lens-row">' + CFG.MODES.map(function(l){
        return '<button type="button" class="lens-b'+(l.id===State.mode?' on':'')+'" data-act="mode" data-mode="'+attr(l.id)+'" ' +
          'title="'+attr(l.desc)+'">'+esc(l.label)+'</button>';
      }).join('') + '</div>' +
      '<div class="faint" style="font-size:12px;margin-top:7px">'+esc(curMode.desc)+'</div>' +
      '<ol class="qlist">' + curMode.questions.map(function(q){ return '<li>'+esc(q)+'</li>'; }).join('') + '</ol>' +
    '</div>';

  /* ---- filing documents ---- */
  var docs = State.docs || [];
  var tenK = (State.filings||[]).filter(function(f){ return String(f.form||'').indexOf('10-K')===0; })[0];
  var docList = docs.length
    ? '<table class="tbl" style="margin-top:10px"><tbody>' + docs.map(function(d,i){
        return '<tr><td>' + esc(d.name) +
          '<div class="faint mono" style="font-size:10.5px">' +
          esc(d.sections.map(function(s){ return 'Item ' + s.id + ' (' + Math.round(s.text.length/1000) + 'k' + (s.truncated?', truncated':'') + ')'; }).join(' · ') || 'no Item sections found') +
          '</div></td>' +
          '<td class="n" style="width:90px">' + btn('rmDoc','Remove','ghost','data-i="'+i+'"') + '</td></tr>';
      }).join('') + '</tbody></table>'
    : '';

  var dropZone = '<div class="drop' + (State.dropping?' over':'') + '" id="dropzone">' +
      '<div class="drop-t">Drop the 10-K here to unlock the qualitative questions</div>' +
      '<div class="drop-s">Numbers alone cannot say what a business does or what management admits could go wrong. ' +
      'Those answers come from Item 1, Item 1A and MD&amp;A — so without a filing the model refuses them.</div>' +
      '<div class="row" style="justify-content:center;margin-top:12px">' +
        '<label class="filebtn">Choose file' +
          '<input type="file" id="docfile" data-files="1" accept=".htm,.html,.txt,text/html,text/plain" multiple>' +
        '</label>' +
        (tenK && tenK.reportUrl
          ? '<a class="filebtn alt" href="'+attr(tenK.reportUrl)+'" target="_blank" rel="noopener noreferrer">Open latest 10-K ↗</a>'
          : '') +
      '</div>' +
      '<div class="faint" style="font-size:11px;margin-top:10px">' +
      'HTML or text. PDF is not supported — it would need an external library, and SEC publishes ' +
      'the same filing as HTML at the link above. Nothing is uploaded anywhere; the file is read in this browser.</div>' +
    '</div>';

  var docPanel = panel('Filing documents' + (docs.length ? ' — ' + docs.length + ' loaded' : ''),
    dropZone + docList +
    ((State.docWarn||[]).length ? note('Could not use ' + State.docWarn.length + ' file' + (State.docWarn.length>1?'s':''),
      '<ul class="bullets prose">' + State.docWarn.map(function(w){ return '<li>'+esc(w)+'</li>'; }).join('') + '</ul>', 'warn') : ''),
    docs.length ? '<span class="tag pos">qualitative questions enabled</span>'
                : '<span class="tag warn">numbers only</span>');

  /* ---- bull / bear / judge ---- */
  var db = State.deb || {status:'idle'};
  var step = function(k, label){
    var order = {bull:0, bear:1, judge:2, done:3};
    var cur = order[db.status]; var mine = order[k];
    var st = db.status==='done' ? 'done'
           : (db.status==='error' ? (mine < cur ? 'done' : 'idle')
           : (mine < cur ? 'done' : (mine === cur ? 'live' : 'idle')));
    return '<div class="dstep ' + st + '">' +
      '<span class="dot">' + (st==='done'?'✓':(st==='live'?'<span class="spin"></span>':(mine+1))) + '</span>' +
      esc(label) + '</div>';
  };
  var running = db.status==='bull' || db.status==='bear' || db.status==='judge';
  var debatePanel = panel('Bull vs Bear vs Judge',
    '<div class="prose" style="margin-bottom:12px">Runs the Lynch Pitch and the Munger Invert on the same evidence, ' +
    'then has a third pass score them <b>on citation quality rather than persuasiveness</b> — ' +
    'catching either side asserting something the sources do not contain.</div>' +
    '<div class="dsteps">' + step('bull','Bull case') + step('bear','Bear case') + step('judge','Judge') + '</div>' +
    '<div class="row" style="margin-top:14px">' +
      btn('debate', running?'Running…':'Run debate', 'primary', running?'disabled':'') +
      (db.at ? '<span class="faint mono" style="font-size:11px">' + esc(db.at) + '</span>' : '') +
      '<span class="faint" style="font-size:11.5px">3 model calls</span>' +
    '</div>' +
    (db.status==='error' ? note('Debate failed','<div class="prose">'+esc(db.error)+'</div>','neg') : '') +
    (db.status==='done' && db.judge ? renderJudge(db.judge) : ''),
    db.status==='done' ? '<span class="tag acc">verdict ready</span>' : '');

  var head = modePicker + '<div class="row" style="margin:12px 0 6px">' +
    btn('thesis', t.status==='loading'?'Generating…':'Generate thesis', 'primary', t.status==='loading'?'disabled':'') +
    (t.at ? '<span class="faint mono" style="font-size:9.5px">generated '+esc(t.at)+'</span>' : '') +
    '<div class="sp"></div>' +
    '<span class="faint mono" style="font-size:9.5px">'+esc(CFG.AI_LABEL)+'</span></div>' +
    '<div class="faint" style="font-size:11.5px;line-height:1.55">' +
    'Every claim must cite a source id and value from the evidence pack, or be marked ' +
    '<span class="mono">Not found in sources</span>. The model is told its own training knowledge does not count. ' +
    'Interpretations beyond a cited number are flagged as inferences. ' +
    '<b>A mode changes which questions get asked of the same filings — it does not train the model and adds no ability to predict prices.</b></div>';

  if(t.status==='loading')
    return localPart + docPanel + debatePanel + panel('Model thesis', head + note('Working', '<span class="spin"></span> Sending metrics and waiting for the response…', 'acc'));
  if(t.status==='error')
    return localPart + docPanel + debatePanel + panel('Model thesis', head + note('Thesis failed', '<div class="prose">'+esc(t.error)+'</div>', 'neg'));
  if(t.status!=='done' || !t.data)
    return localPart + docPanel + debatePanel + panel('Model thesis', head + '<div class="faint mono" style="font-size:10.5px;padding:14px 0;text-align:center">' +
      'No model thesis generated for ' + esc(State.ticker) + ' yet — the assessment above needs no model.</div>');

  /* ---- cited-answer rendering (research framework) ---- */
  var d = t.data;
  if(d && Array.isArray(d.answers)){
    var qs = curMode.questions;
    var ev = State.evidence || {sources:[]};

    var qaHtml = d.answers.map(function(a){
      var n = num(a.n); var idx = (n===null?0:n) - 1;
      var q = qs[idx] || ('Question ' + (n||'?'));
      var cites = asArr(a.citations).filter(function(c){ return String(c||'').trim(); });
      return '<div class="qa' + (a.notFound?' nf':'') + '">' +
        '<div class="qa-q"><span class="qa-n">' + esc(String(n||'?')) + '</span>' + esc(q) + '</div>' +
        '<div class="qa-a">' + esc(a.answer || '—') + '</div>' +
        (cites.length
          ? '<div class="qa-c">' + cites.map(function(c){
              return '<div>' + esc(typeof c==='string'?c:JSON.stringify(c)) + '</div>'; }).join('') + '</div>'
          : (a.notFound ? '<div class="qa-c nf-tag">Not found in sources</div>' : '')) +
      '</div>';
    }).join('');

    var srcRows = (ev.sources||[]).map(function(s){
      return '<tr><td class="mono acc">['+esc(s.id)+']</td>' +
        '<td>'+esc(s.form)+(s.year?' FY'+esc(s.year):'')+'</td>' +
        '<td class="dim">'+esc(s.filed||'—')+'</td>' +
        '<td>'+(s.url?'<a href="'+attr(s.url)+'" target="_blank" rel="noopener noreferrer">sec.gov document</a>':'<span class="faint">no document link</span>')+'</td></tr>';
    }).join('');

    return localPart +
      docPanel + debatePanel + panel(curMode.label + ' — ' + State.ticker, head) +
      panel('Answers', '<div class="qa-wrap">' + qaHtml + '</div>' +
        (d.bottomLine ? '<div class="hr"></div><div class="lbl" style="margin-bottom:5px">Bottom line</div>' +
          '<div class="prose">'+esc(d.bottomLine)+'</div>' : ''),
        '<span class="faint mono" style="font-size:11px">' + d.answers.length + ' of ' + qs.length + ' answered</span>') +
      '<div class="grid g2">' +
        panel('Not found in sources',
          (asArr(d.notFound).length ? bullets(d.notFound)
            : '<div class="prose">The model reported no unanswerable items.</div>') +
          '<div class="faint" style="font-size:11px;margin-top:8px">What it could not answer is more useful than what it could.</div>') +
        panel('Marked as inference',
          (asArr(d.inferences).length ? bullets(d.inferences)
            : '<div class="prose">No interpretations were flagged as going beyond a cited number.</div>')) +
      '</div>' +
      (d.recencyNote ? note('Data recency','<div class="prose">'+esc(d.recencyNote)+'</div>','warn') : '') +
      panelT('Sources the model was given',
        '<div class="scroll"><table class="tbl"><thead><tr><th>ID</th><th>Document</th><th>Filed</th><th>Verify</th></tr></thead><tbody>' +
        srcRows + '</tbody></table></div>',
        '<span class="faint mono" style="font-size:11px">nothing outside this list was available to it</span>');
  }

  /* ---- legacy summary schema (older cached responses) ---- */
  var conv = num(d.convictionScore);
  var convCls = conv===null?'':(conv>=7?'pos':(conv>=4?'warn':'neg'));
  var rank = {high:0, medium:1, low:2};
  var risks = asArr(d.keyRisks).map(function(r){
    if(typeof r === 'string') return {risk:r, severity:''};
    return {risk: r && (r.risk||r.name||JSON.stringify(r)), severity: String((r&&r.severity)||'').toLowerCase()};
  }).sort(function(a,b){
    var ra = rank[a.severity]===undefined?3:rank[a.severity];
    var rb = rank[b.severity]===undefined?3:rank[b.severity];
    return ra-rb;
  });
  var moat = d.moat || {};
  var strength = String(moat.strength||'').toLowerCase();

  return localPart + panel('Model thesis', head +
      (d.thesis ? '<div class="hr"></div><div class="prose">'+esc(d.thesis)+'</div>' : '')) +
    '<div class="grid g2">' +
      panel('Bull case', bullets(d.bullCase)) +
      panel('Bear case', bullets(d.bearCase)) +
    '</div>' +
    panelT('Key risks, ranked',
      risks.length ? '<table class="tbl"><thead><tr><th style="width:76px">Severity</th><th>Risk</th></tr></thead><tbody>' +
        risks.map(function(r){
          var k = r.severity==='high'?'neg':(r.severity==='medium'?'warn':(r.severity==='low'?'pos':''));
          return '<tr><td>'+tag(r.severity||'unrated', k)+'</td><td class="prose" style="font-family:var(--sans)">'+esc(r.risk)+'</td></tr>';
        }).join('') + '</tbody></table>'
      : '<div class="faint mono" style="font-size:10.5px;padding:9px">none returned</div>') +
    '<div class="grid g2">' +
      panel('Moat',
        '<div class="row" style="margin-bottom:6px">' +
        tag(strength||'unrated', strength==='wide'?'pos':(strength==='narrow'?'warn':(strength==='none'?'neg':''))) +
        '</div><div class="prose">'+esc(moat.assessment||'—')+'</div>') +

function refreshLive(keys){
  keys.forEach(function(k){
    if(!LIVE[k]) return;

    if(el) el.innerHTML = LIVE[k]();

/* Single render pass. Focus and caret are saved and restored, otherwise
   typing into any field would break the moment something re-rendered. */
function render(){
  var a = document.activeElement;
  var id = (a && a.id && root.contains(a)) ? a.id : null;
  var selS = null, selE = null;
  if(id){
    try { if('selectionStart' in a){ selS = a.selectionStart; selE = a.selectionEnd; } } catch(e){}
  }
  var sy = window.scrollY || window.pageYOffset || 0;

  root.innerHTML = view();

  if(id){
    var n = document.getElementById(id);
    if(n){
      try { n.focus({preventScroll:true}); } catch(e){ try{ n.focus(); }catch(e2){} }
      if(selS!==null && typeof n.setSelectionRange==='function'){
        try { n.setSelectionRange(selS, selE); } catch(e){}
      }
    }
  }
  window.scrollTo(0, sy);
}

/* Live poll. Ticks the clock and the "Ns ago" readout even when the quote
   itself has not moved, so the display never looks fresher than it is. */

function startLive(){
  if(liveTimer) window.clearInterval(liveTimer);

      ingestFiles(e.dataTransfer.files);

});

/* Read a filing, pull its Item sections, and register it as a citable source. */
function ingestFiles(files){
  var list = Array.prototype.slice.call(files);
  if(!list.length) return;
  var done = 0, added = 0, problems = [];

  list.forEach(function(file){
    if(file.size > 25*1024*1024){
      problems.push(file.name + ' is larger than 25 MB — that is not a filing, skipped.');
      if(++done===list.length) finish();
      return;
    }
    var fr = new FileReader();
    fr.onerror = function(){
      problems.push('Could not read ' + file.name + '.');
      if(++done===list.length) finish();
    };
    fr.onload = function(){
      try{
        var raw = String(fr.result||'');
        if(/%PDF-/.test(raw.slice(0,1024))){
          problems.push(file.name + ' is a PDF. Save the filing as HTML instead — SEC publishes ' +
                        'the same document as .htm at the link above.');
        } else {
          var text = /<[a-z!][\s\S]*>/i.test(raw.slice(0,4000)) ? stripHtml(raw) : raw;
          var secs = findSections(text);
          if(!secs.length){
            problems.push(file.name + ' parsed, but no Item 1 / 1A / 7 sections were found in it. ' +
                          'Is it the full 10-K rather than an exhibit or cover page?');
          } else {
            var tag = String(State.ticker || 'DOC') +
                      (State.docs.length ? '-' + (State.docs.length+1) : '');
            State.docs.push({
              name: file.name, tag: tag, sections: secs,
              fy: (text.match(/fiscal year ended[^\d]{0,20}(\d{4})/i)||[])[1] || '',
              url: '', filed: ''
            });
            added++;
          }
        }
      }catch(err){ problems.push('Failed to parse ' + file.name + ': ' + err.message); }
      if(++done===list.length) finish();
    };
    fr.readAsText(file);
  });

  function finish(){
    State.docWarn = problems;
    if(added) toast(added + ' filing' + (added>1?'s':'') + ' loaded');
    else render();
  }
}

function fetchTicker(sym){
  sym = String(sym||'').trim().toUpperCase().replace(/\s+/g,'');
  /* No key: serve any bundled company straight from the snapshot. Only a
     ticker outside the bundle needs the user to connect their own data. */
  if(!FINNHUB_KEY){
    if(demoHas(sym)){ loadDemo(sym); return Promise.resolve(); }
    State.notBundled = sym;
    render();
    return Promise.resolve();
  }
  if(!sym){ toast('enter a ticker'); return Promise.resolve(); }
  Draft.ticker = sym;
  State.ticker = sym;
  State.loading = true;
  State.fatal = null;
  State.warnings = [];
  State.thesis = {status:'idle', data:null, error:'', at:''};
  if(State.tab==='settings') State.tab = 'overview';
  set({}, {});

  return loadAll(sym).then(function(r){
    State.quote = r.quote; State.profile = r.profile; State.metric = r.metric; State.annuals = r.annuals;
    State.warnings = r.warnings; State.fatal = r.fatal;
    State.metrics = r.fatal ? null : computeMetrics();
    State.loading = false;
    set({}, {});
  }).catch(function(err){
    State.loading = false;
    State.metrics = null;
    State.fatal = (err && err.message) ? err.message : 'Unexpected failure while loading ' + sym + '.';
    set({}, {});
  });
}

function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext!==false){
    return navigator.clipboard.writeText(text).catch(function(){ return legacyCopy(text); });
  }
  return legacyCopy(text);
}
function legacyCopy(text){
  return new Promise(function(res, rej){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch(e){ ok = false; }
    document.body.removeChild(ta);
    ok ? res() : rej(new Error('execCommand copy failed'));
  });
}

function buildMarkdown(){
  var m = State.metrics; if(!m) return '';
  var sig = runSignal(m, State.weights);
  var dcf = runDcf(m, State.dcf);
  var L = [];
  var row = function(a,b){ L.push('| ' + a + ' | ' + b + ' |'); };

  L.push('# ' + State.ticker + (m.name ? ' — ' + m.name : ''));
  L.push('');
  L.push('_Generated ' + nowStamp() + ' · data: Finnhub · quote as of ' + tsFmt(m.quoteTime) + '_');
  L.push('');
  L.push('> A modelling tool, not investment advice. Nobody involved is a licensed advisor.');
  L.push('');

  L.push('## Quote');
  L.push('');
  L.push('| Field | Value |'); L.push('|---|---|');
  row('Price', px(m.price,m.currency));
  row('Change', sgn(m.change,2) + ' (' + pctS(m.changePct,2) + ')');
  row('Open / High / Low', px(m.open) + ' / ' + px(m.high) + ' / ' + px(m.low));
  row('Prev close', px(m.prevClose));
  row('52-week range', px(m.wk52Low) + ' – ' + px(m.wk52High));
  row('Exchange / industry', (m.exchange||'—') + ' / ' + (m.industry||'—'));
  L.push('');

  L.push('## Metrics');
  L.push('');
  L.push('| Metric | Value |'); L.push('|---|---|');
  row('Market cap', money(m.marketCap,m.currency));
  row('Shares outstanding', money(m.shares));
  row('Revenue TTM (derived)', money(m.revenueTTM,m.currency));
  row('Free cash flow', money(m.latestFcf,m.currency) + (m.latestFcfSource?' — '+m.latestFcfSource:''));
  row('P/E TTM', m.pe===null?'--':fx(m.pe,1)+'x');
  row('P/S', m.priceToSales===null?'--':fx(m.priceToSales,2)+'x');
  row('P/B', m.pb===null?'--':fx(m.pb,2)+'x');
  row('FCF yield', pct(m.fcfYield,2));
  row('Revenue growth TTM YoY', pctS(m.revGrowth,1));
  row('Revenue CAGR', pctS(m.revenueCagr,1) + (m.years.length?' over '+m.years.length+'y':''));
  row('EPS growth', pctS(m.epsGrowth,1));
  row('Gross / operating / net margin', pct(m.grossMargin,1)+' / '+pct(m.opMargin,1)+' / '+pct(m.netMargin,1));
  row('Operating margin trend', m.marginTrend===null?'--':sgn(m.marginTrend,1)+'pp');
  row('ROE / ROI', pct(m.roe,1)+' / '+pct(m.roi,1));
  row('Current ratio', m.currentRatio===null?'--':fx(m.currentRatio,2)+'x');
  row('Debt / equity', m.de===null?'--':fx(m.de,2)+'x');
  row('Beta', fx(m.beta,2));
  row('Dividend yield', pct(m.divYield,2));
  L.push('');

  L.push('## Signal engine');
  L.push('');
  L.push('**Composite ' + (sig.composite===null?'--':sig.composite.toFixed(1)) + '** — band: ' +
    (sig.band?sig.band.label:'none') + ' · data coverage ' + sig.coverage.toFixed(0) + '% (' +
    sig.inputsPresent + '/' + sig.inputsTotal + ' inputs) · ' + sig.included + ' of ' + sig.factors.length + ' factors in composite.');
  L.push('');
  L.push('Bands are the configured rule set scoring itself, not a recommendation. Factors with under half their inputs present are dropped and the remaining weights renormalised.');
  L.push('');
  sig.factors.forEach(function(f){
    L.push('### ' + f.label + ' — ' + (f.score===null?'--':f.score.toFixed(1)) +
      ' (' + f.earned + '/' + f.possible + ' pts, weight ' + fx(f.weight,0) + ', ' +
      (f.included?'included':'EXCLUDED — only ' + f.present + '/' + f.inputs + ' inputs present') + ')');
    L.push('');
    L.push('| Rule | Result | Value tested | Points |'); L.push('|---|---|---|---|');
    f.trace.forEach(function(r){
      L.push('| ' + r.label + ' | ' + (r.status==='nodata'?'no data':r.status) + ' | ' + r.value + ' | ' +
        (r.status==='nodata'?'excluded':(r.earned + '/' + r.pts)) + ' |');
    });
    if(f.missing.length){ L.push(''); L.push('_Missing inputs: ' + f.missing.join(', ') + '_'); }
    L.push('');
  });

  L.push('## DCF');
  L.push('');
  if(dcf.error){
    L.push('Not computed: ' + dcf.error);
  } else {
    L.push('| Field | Value |'); L.push('|---|---|');
    row('Initial growth', pct(dcf.assumptions.growth,1));
    row('Fade period', dcf.assumptions.fade + ' years');
    row('Terminal growth', pct(dcf.assumptions.terminal,1));
    row('Discount rate', pct(dcf.assumptions.discount,2));
    row('Starting FCF', money(dcf.fcf0,m.currency));
    row('Intrinsic value / share', px(dcf.perShare,m.currency));
    row('Current price', px(dcf.price,m.currency));
    row('Margin of safety', pctS(dcf.mos,1));
    row('Terminal value / EV', pct(dcf.tvShare,1) + (dcf.tvHot?' — above 75%, the result is driven by the terminal assumption':''));
    L.push('');
    L.push('_No net-debt bridge: enterprise value is divided by share count directly._');
  }
  L.push('');

  if(m.years.length){
    L.push('## Annual filings as reported');
    L.push('');
    L.push('| FY | Revenue | Operating income | Net income | EPS | FCF |'); L.push('|---|---|---|---|---|---|');
    m.years.slice().reverse().forEach(function(y){
      L.push('| FY' + y.year + ' | ' + money(y.revenue) + ' | ' + money(y.opIncome) + ' | ' +
        money(y.netIncome) + ' | ' + fx(y.eps,2) + ' | ' + money(y.fcf) + ' |');
    });
    L.push('');
  }

  var t = State.thesis;
  /* New cited-answer schema: export the questions, answers and their sources
     so the memo is verifiable away from the app. */
  if(t.status==='done' && t.data && Array.isArray(t.data.answers)){
    var d = t.data;
    var mode = CFG.MODES.filter(function(x){ return x.id===State.mode; })[0] || CFG.MODES[0];
    L.push('## ' + mode.label + ' — ' + State.ticker);
    L.push('');
    L.push('_Generated by ' + CFG.AI_LABEL + '. Every claim is cited to the evidence pack below; ' +
           'anything uncited was refused as "not found in sources"._');
    L.push('');
    d.answers.forEach(function(a){
      var i = (num(a.n)||0) - 1;
      L.push('### ' + (a.n||'?') + '. ' + (mode.questions[i] || ''));
      L.push('');
      L.push(String(a.answer||'—'));
      L.push('');
      asArr(a.citations).forEach(function(c){ L.push('> `' + String(c) + '`'); });
      if(a.notFound) L.push('> **Not found in sources.**');
      L.push('');
    });
    if(d.bottomLine){ L.push('**Bottom line** — ' + String(d.bottomLine)); L.push(''); }
    if(asArr(d.notFound).length){
      L.push('**Not found in sources**'); L.push('');
      asArr(d.notFound).forEach(function(x){ L.push('- ' + String(x)); });
      L.push('');
    }
    if(asArr(d.inferences).length){
      L.push('**Marked as inference**'); L.push('');
      asArr(d.inferences).forEach(function(x){ L.push('- ' + String(x)); });
      L.push('');
    }
    if(d.recencyNote){ L.push('**Data recency** — ' + String(d.recencyNote)); L.push(''); }
    var ev = State.evidence;
    if(ev && ev.sources && ev.sources.length){
      L.push('**Sources supplied to the model**'); L.push('');
      L.push('| ID | Document | Filed | Link |'); L.push('|---|---|---|---|');
      ev.sources.forEach(function(s){
        L.push('| `[' + s.id + ']` | ' + s.form + (s.year?' FY'+s.year:'') + ' | ' + (s.filed||'—') +
               ' | ' + (s.url ? s.url : '—') + ' |');
      });
      L.push('');
    }
  } else if(t.status==='done' && t.data){
    var d = t.data;
    L.push('## Thesis (' + CFG.AI_LABEL + ')');
    L.push('');
    if(d.thesis){ L.push(String(d.thesis)); L.push(''); }
    var sec = function(title, items){
      L.push('**' + title + '**'); L.push('');
      asArr(items).forEach(function(x){ L.push('- ' + (typeof x==='string'?x:JSON.stringify(x))); });
      L.push('');
    };
    sec('Bull case', d.bullCase);
    sec('Bear case', d.bearCase);
    L.push('**Key risks**'); L.push('');
    asArr(d.keyRisks).forEach(function(r){
      if(typeof r==='string') L.push('- ' + r);
      else L.push('- [' + String((r&&r.severity)||'unrated') + '] ' + String((r&&r.risk)||''));
    });
    L.push('');
    if(d.moat){ L.push('**Moat (' + String(d.moat.strength||'unrated') + ')** — ' + String(d.moat.assessment||'')); L.push(''); }
    L.push('**Conviction ' + fx(num(d.convictionScore),1) + '/10** — ' + String(d.convictionReasoning||''));
    L.push('');
    sec('Data gaps identified by the model', d.dataGaps);
    sec('What would change its mind', d.whatWouldChangeMyMind);
  }

  if(State.warnings.length){
    L.push('## Data warnings');
    L.push('');
    State.warnings.forEach(function(w){ L.push('- ' + w); });
    L.push('');
  }

  L.push('---');
  L.push('');
  L.push('A modelling tool, not investment advice. Nobody involved is a licensed advisor. ' +
    'Figures come from third-party APIs and may be wrong, stale or misattributed. ' +
    'No backtest is included by design: free providers serve restated fundamentals, and scoring rules against them leaks the future.');

  return L.join('\n');
}

/* --- boot --- */
if(window.addEventListener) window.addEventListener('hashchange', function(){
  var h = tabFromHash();
  if(h && h !== State.tab) set({tab:h});
});
restore();
if(FINNHUB_KEY){
  render();
  fetchTicker(State.ticker).then(function(){ fetchWatchlist(); startLive(); });
} else if(CFG.DEMO){
  loadDemo();            /* renders; no network, no gate, works instantly */
} else {
  render();
}

})();
</script>
</body>
</html>
