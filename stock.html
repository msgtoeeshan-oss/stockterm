<style>
/* ── design tokens ─────────────────────────────────────────────── */
:root{
  --bg:#0a0813;        --panel:#14121f;     --panel-2:#1b1829;
  --well:#0d0b16;      --line:#272238;      --line-2:#372f4d;
  --text:#eef0f7;      --dim:#9a94b0;       --faint:#6a6482;
  --pos:#34d399;       --neg:#fb7185;       --warn:#fbbf24;
  --accent:#8b7cf6;    --accent-2:#ec4899;  --violet:#a78bfa;   --tag:#fbbf24;
  --grad:linear-gradient(120deg,#8b7cf6,#ec4899);
  --r:16px;            --r-sm:11px;         --r-pill:999px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono","Courier New",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.5;
     -webkit-font-smoothing:antialiased;min-height:100vh}
/* ambient glow, fixed so it never scrolls or costs layout */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(58% 42% at 12% 0%,rgba(139,124,246,.20),transparent 62%),
             radial-gradient(48% 38% at 92% 4%,rgba(236,72,153,.13),transparent 60%)}
#root{position:relative;z-index:1}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3{margin:0;font-weight:600}
p{margin:0 0 7px}
::selection{background:rgba(74,144,226,.3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
.acc{color:var(--accent)} .vio{color:var(--violet)}
.dim{color:var(--dim)} .faint{color:var(--faint)}
.lbl{font-family:var(--sans);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);font-weight:600}
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.sp{flex:1}
.wrap{max-width:1360px;margin:0 auto;padding:6px 18px 60px}
.hr{height:1px;background:var(--line);border:0;margin:14px 0}

/* ── header ────────────────────────────────────────────────────── */
.hdr{padding-top:14px}
.hdr-in{max-width:1360px;margin:0 auto;padding:0 18px 12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;white-space:nowrap}
.logo .mk{width:30px;height:30px;border-radius:9px;background:var(--grad);display:flex;
  align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff;flex:none}
.logo b{font-size:17px;font-weight:700;letter-spacing:-.02em;color:var(--text);font-family:var(--sans)}
.logo em{display:none}
.search{flex:1;min-width:180px;max-width:340px;position:relative}
/* must out-specify the global input[type=text] rule further down the sheet */
.hdr .search input[type=text]{width:100%;background:var(--panel-2);border:1px solid var(--line);
  color:var(--text);font-family:var(--sans);font-size:13px;padding:10px 14px 10px 34px;border-radius:var(--r-pill)}
.hdr .search input[type=text]::placeholder{color:var(--faint)}
.hdr .search input[type=text]:focus{border-color:var(--accent);background:var(--panel)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.65}
.hdr .go{background:var(--grad);border:0;color:#fff;font-family:var(--sans);font-size:12.5px;
  font-weight:600;padding:10px 20px;border-radius:var(--r-pill);cursor:pointer}
.hdr .go:hover{filter:brightness(1.12)}
.hdr .go.alt{background:var(--panel-2);border:1px solid var(--line-2);color:var(--dim)}
.hdr .go.alt:hover{color:var(--text);border-color:var(--accent);filter:none}
.hdr .go[disabled]{opacity:.5;cursor:not-allowed}

/* ── nav pills ─────────────────────────────────────────────────── */
.nav{max-width:1360px;margin:0 auto;padding:0 18px 4px}
.nav-in{display:flex;align-items:center;gap:5px;overflow-x:auto;scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
.nav-i{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--dim);background:transparent;
  border:0;border-radius:var(--r-pill);padding:9px 16px;cursor:pointer;white-space:nowrap}
.nav-i:hover{background:var(--panel-2);color:var(--text)}
.nav-i.on{background:var(--panel-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
.clock{font-family:var(--sans);font-size:11.5px;color:var(--faint);padding:0 8px;white-space:nowrap}

/* ── buttons / inputs ──────────────────────────────────────────── */
button{font-family:var(--sans);font-size:12px;font-weight:600;
  background:var(--panel-2);color:var(--text);border:1px solid var(--line-2);
  padding:8px 15px;border-radius:var(--r-pill);cursor:pointer;transition:border-color .15s,color .15s}
button:hover:not([disabled]){border-color:var(--accent);color:#fff}
button.primary{background:var(--grad);border:0;color:#fff}
button.primary:hover:not([disabled]){filter:brightness(1.12)}
button.danger:hover:not([disabled]){border-color:var(--neg);color:var(--neg)}
button.ghost{background:transparent;color:var(--dim)}
button[disabled]{opacity:.45;cursor:not-allowed}
input[type=text],input[type=password]{font-family:var(--mono);font-size:13px;background:var(--well);
  color:var(--text);border:1px solid var(--line-2);padding:10px 13px;border-radius:var(--r-sm);width:100%}
input:focus{border-color:var(--accent);outline:none}

/* ── panels ────────────────────────────────────────────────────── */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin:12px 0;overflow:hidden}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:14px 18px 0}
.panel-h h2{font-family:var(--sans);font-size:13.5px;font-weight:600;letter-spacing:-.01em;color:var(--text)}
.panel-b{padding:14px 18px 18px}
.panel-b.tight{padding:10px 0 0}
.panel-b.pad4{padding:10px}

.grid{display:grid;gap:12px}
@media(min-width:940px){
  .g2{grid-template-columns:1fr 1fr}
  .g32{grid-template-columns:1.3fr 1fr}
  .g23{grid-template-columns:1fr 1.55fr}
}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 15px}
.card .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:21px;margin-top:5px;letter-spacing:-.03em}
.card .s{font-size:10.5px;color:var(--faint);margin-top:3px}

/* ── quote strip ───────────────────────────────────────────────── */
.quote{display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap;padding:20px 22px}
.q-sym{font-family:var(--sans);font-size:26px;font-weight:700;letter-spacing:-.03em}
.q-px{font-family:var(--mono);font-size:44px;line-height:1;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.q-ch{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;margin-top:5px}
.q-meta{display:flex;gap:22px;flex-wrap:wrap}
.q-meta>div{min-width:62px}
.q-meta .v{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;margin-top:3px}
.rangebar{position:relative;height:6px;background:var(--well);border:1px solid var(--line);
  border-radius:var(--r-pill);margin-top:8px;min-width:150px}
.rangebar i{position:absolute;top:-3px;width:3px;height:10px;background:var(--tag);border-radius:2px}

/* ── factor bars ───────────────────────────────────────────────── */
.breadth{border:1px solid var(--line);background:var(--panel);padding:14px 16px;border-radius:var(--r-sm)}
.breadth-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font-size:12px;font-weight:600;margin-bottom:9px}
.breadth-h .c{color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em}
.breadth-b{display:flex;height:7px;background:var(--well);border-radius:var(--r-pill);overflow:hidden}
.breadth-b i{display:block;height:100%}
.breadth-b i.g{background:var(--pos)}
.breadth-b i.r{background:rgba(251,113,133,.35)}
.breadth-b i.o{background:var(--line-2)}

/* ── verdict header (Analysis tab) ─────────────────────────────── */
.verdict{margin:12px 0;padding:26px 28px;
  background:linear-gradient(120deg,rgba(139,124,246,.16),rgba(236,72,153,.09)),var(--panel);
  border:1px solid var(--line-2);border-radius:var(--r)}
.vtop{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
/* factor bars */
.fbars{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;
  margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.fb-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:7px}
.fb-h span:first-child{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--dim)}
.fb-v{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums}
.fb-v.pos{color:var(--pos)} .fb-v.warn{color:var(--warn)} .fb-v.neg{color:var(--neg)}
.fb-t{height:6px;background:var(--well);border-radius:var(--r-pill);overflow:hidden}
.fb-t i{display:block;height:100%;background:var(--line-2);border-radius:var(--r-pill)}
.fb-t i.pos{background:var(--pos)} .fb-t i.warn{background:var(--warn)} .fb-t i.neg{background:var(--neg)}
.fb-x{font-family:var(--sans);font-size:10.5px;color:var(--faint);margin-top:5px}
.vscore{font-family:var(--mono);font-size:68px;line-height:.95;letter-spacing:-.055em;font-variant-numeric:tabular-nums}
.vscore span{font-size:19px;color:var(--faint);letter-spacing:0}
.vtext{flex:1;min-width:280px}
.vband{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:8px}
.vplain{font-family:var(--sans);font-size:19px;font-weight:650;letter-spacing:-.02em;color:var(--text)}
.vsub{font-family:var(--sans);font-size:13px;line-height:1.55;color:var(--dim)}
.vmeta{text-align:right;min-width:96px}

/* findings list: plain sentence first, the rule underneath */
.findings{list-style:none;margin:0;padding:0}
.findings li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.findings li:last-child{border-bottom:0}
.findings .mk{flex:none;width:22px;height:22px;border-radius:7px;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:700;margin-top:1px}
.findings .mk.y{background:rgba(52,211,153,.16);color:var(--pos)}
.findings .mk.n{background:rgba(251,113,133,.16);color:var(--neg)}
.findings .mk.o{background:var(--panel-2);color:var(--dim)}
.findings .pl{display:block;font-family:var(--sans);font-size:14px;line-height:1.45;color:var(--text)}
.findings .tech{display:block;font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:3px}

/* ── research mode picker ──────────────────────────────────────── */
.lens-row{display:flex;gap:6px;flex-wrap:wrap}
.lens-b{font-family:var(--sans);font-size:12.5px;font-weight:600;padding:9px 17px;
  background:var(--panel-2);border:1px solid var(--line-2);color:var(--dim);border-radius:var(--r-pill)}
.lens-b:hover{color:var(--text);border-color:var(--dim)}
.lens-b.on{background:var(--grad);border-color:transparent;color:#fff}
.qlist{margin:10px 0 0;padding-left:20px;color:var(--faint);font-size:12px;line-height:1.65}
.qlist li{margin-bottom:2px}

.symchips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.symchip{font-family:var(--mono);font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:var(--r-pill);
  background:var(--panel-2);border:1px solid var(--line);color:var(--dim)}
.symchip:hover{color:var(--text);border-color:var(--line-2)}
.symchip.on{background:var(--grad);border-color:transparent;color:#fff}

.demobar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0;padding:12px 18px;
  background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.30);border-radius:var(--r);
  font-family:var(--sans);font-size:12.5px;color:var(--text)}

/* ── debate stepper ────────────────────────────────────────────── */
.dsteps{display:flex;gap:8px;flex-wrap:wrap}
.dstep{display:flex;align-items:center;gap:8px;font-family:var(--sans);font-size:12.5px;font-weight:600;
  padding:9px 15px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--panel-2);color:var(--faint)}
.dstep .dot{width:19px;height:19px;border-radius:50%;background:var(--well);border:1px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;font-size:10.5px}
.dstep.done{color:var(--pos);border-color:rgba(52,211,153,.4)}
.dstep.done .dot{background:rgba(52,211,153,.16);border-color:transparent;color:var(--pos)}
.dstep.live{color:var(--text);border-color:var(--accent)}
.jbox{border:1px solid var(--line);border-left:3px solid var(--line-2);border-radius:var(--r-sm);padding:13px 15px;background:var(--panel-2)}
.jbox.pos{border-left-color:var(--pos)}
.jbox.neg{border-left-color:var(--neg)}

/* ── document drop zone ────────────────────────────────────────── */
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:24px 20px;text-align:center;
  background:var(--panel-2);transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:rgba(139,124,246,.10)}
.drop-t{font-family:var(--sans);font-size:14.5px;font-weight:650;color:var(--text);margin-bottom:6px}
.drop-s{font-family:var(--sans);font-size:12.5px;line-height:1.6;color:var(--dim);max-width:560px;margin:0 auto}
.filebtn{display:inline-block;font-family:var(--sans);font-size:12.5px;font-weight:600;color:#fff;
  background:var(--grad);padding:10px 18px;border-radius:var(--r-pill);cursor:pointer;border:0}
.filebtn:hover{filter:brightness(1.12);text-decoration:none}
.filebtn.alt{background:var(--panel);border:1px solid var(--line-2);color:var(--dim)}
.filebtn.alt:hover{color:var(--text);filter:none}
.filebtn input[type=file]{display:none}

/* ── cited answers ─────────────────────────────────────────────── */
.qa-wrap{display:flex;flex-direction:column;gap:16px}
.qa{border-left:2px solid var(--line-2);padding-left:16px}
.qa.nf{border-left-color:var(--warn)}
.qa-q{display:flex;gap:9px;align-items:baseline;font-family:var(--sans);font-size:13px;
  font-weight:650;color:var(--text);margin-bottom:7px}
.qa-n{flex:none;width:21px;height:21px;border-radius:50%;background:var(--panel-2);
  border:1px solid var(--line-2);color:var(--violet);font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.qa-a{font-family:var(--sans);font-size:13.5px;line-height:1.65;color:#c9c6d8}
.qa-c{margin-top:9px;font-family:var(--mono);font-size:11px;line-height:1.7;color:var(--faint);
  background:var(--well);border:1px solid var(--line);border-radius:8px;padding:9px 12px;
  overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.qa-c.nf-tag{color:var(--warn);white-space:normal}

/* ── call-to-action bar ────────────────────────────────────────── */
.cta{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:12px 0;padding:18px 22px;
  background:linear-gradient(120deg,rgba(139,124,246,.18),rgba(236,72,153,.10)),var(--panel);
  border:1px solid var(--line-2);border-radius:var(--r)}
.cta .t{font-family:var(--sans);font-size:15px;font-weight:650;letter-spacing:-.015em;color:var(--text)}
.cta .s{font-family:var(--sans);font-size:12.5px;color:var(--dim);margin-top:3px}
.cta button{background:var(--grad);border:0;color:#fff;font-size:12.5px;padding:10px 18px}
.cta button:hover{filter:brightness(1.12);color:#fff}
.cta button.ghost{background:var(--panel-2);border:1px solid var(--line-2);color:var(--dim)}
.cta button.ghost:hover{color:var(--text);filter:none}

/* ── heatmap tiles ─────────────────────────────────────────────── */
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:8px}
.heat button{display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:1px solid var(--line);padding:15px 5px;border-radius:var(--r-sm);background:var(--panel-2);cursor:pointer;gap:3px}
.heat button:hover{border-color:var(--line-2);transform:translateY(-1px)}
.heat .t{font-family:var(--sans);font-size:13px;font-weight:700;color:#fff;letter-spacing:-.01em}
.heat .p{font-family:var(--mono);font-size:11.5px;color:rgba(255,255,255,.94);font-variant-numeric:tabular-nums}

/* ── tables ────────────────────────────────────────────────────── */
.tbl{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;color:var(--dim);font-family:var(--sans);font-weight:600;font-size:10.5px;
  letter-spacing:.07em;text-transform:uppercase;padding:9px 18px;background:transparent;
  border-bottom:1px solid var(--line)}
.tbl td{padding:10px 18px;border-bottom:1px solid var(--line)}
.tbl tbody tr:hover{background:var(--panel-2)}
.tbl tr:last-child td{border-bottom:0}
.tbl .n{text-align:right}
.tbl tr.off td{color:var(--faint)}
.tbl a.tk{font-weight:600;color:var(--violet)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scroll-y{max-height:340px;overflow-y:auto}

/* ── tags / notes ──────────────────────────────────────────────── */
.tag{font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:4px 11px;border-radius:var(--r-pill);border:1px solid var(--line-2);color:var(--dim);white-space:nowrap}
.tag.pos{color:#04231a;background:var(--pos);border-color:var(--pos)}
.tag.neg{color:#2a0910;background:var(--neg);border-color:var(--neg)}
.tag.warn{color:#291c02;background:var(--warn);border-color:var(--warn)}
.tag.acc{color:#fff;background:var(--grad);border-color:transparent}
.note{border:1px solid var(--line);border-left:3px solid var(--dim);background:var(--panel-2);
  padding:13px 16px;border-radius:var(--r-sm);margin:12px 0;font-size:13px}
.note.warn{border-left-color:var(--warn)} .note.neg{border-left-color:var(--neg)}
.note.acc{border-left-color:var(--accent)}
.note b{font-family:var(--sans);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  display:block;margin-bottom:5px;color:var(--dim)}

/* ── sliders ───────────────────────────────────────────────────── */
.sld{margin:12px 0}
.sld-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sld-h .v{font-family:var(--mono);font-size:14px;color:var(--violet);font-variant-numeric:tabular-nums;font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;
  height:22px;padding:0;border:0;margin:5px 0 0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:5px;background:var(--line-2);border-radius:99px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;
  background:#fff;border:0;margin-top:-6px;box-shadow:0 0 0 4px rgba(139,124,246,.35)}
input[type=range]::-moz-range-track{height:5px;background:var(--line-2);border-radius:99px}
input[type=range]::-moz-range-thumb{width:17px;height:17px;border:0;border-radius:50%;background:#fff;
  box-shadow:0 0 0 4px rgba(139,124,246,.35)}

/* ── sensitivity grid ──────────────────────────────────────────── */
.sens td,.sens th{text-align:center;padding:9px 6px;font-size:12px}
.sens td{border:1px solid var(--line);border-radius:6px}
.sens td.hi{background:rgba(52,211,153,.15);color:var(--pos)}
.sens td.lo{background:rgba(251,113,133,.15);color:var(--neg)}
.sens td.cur{outline:2px solid var(--violet);outline-offset:-2px;font-weight:700}
.sens td.na{color:var(--faint)}

.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--mono);font-variant-numeric:tabular-nums}

.prose{font-family:var(--sans);font-size:13.5px;line-height:1.65;color:#c9c6d8}
.bullets{margin:0;padding-left:18px}
.bullets li{margin-bottom:7px}

/* ── first-run setup ───────────────────────────────────────────── */
.setup{max-width:560px;margin:7vh auto;padding:0 20px}
.setup-card{background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r);padding:30px}
.steps{counter-reset:s;list-style:none;padding:0;margin:20px 0}
.steps li{counter-increment:s;position:relative;padding:0 0 18px 40px}
.steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:25px;height:25px;border-radius:50%;
  background:var(--panel-2);border:1px solid var(--line-2);color:var(--violet);
  font-family:var(--sans);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.spin{display:inline-block;width:8px;height:8px;border:1.5px solid var(--line-2);
  border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}

@media(max-width:640px){
  .wrap{padding:6px 6px 40px}
  .q-px{font-size:25px}
  .quote{gap:12px}
  .logo b{font-size:18px}
  .logo em{display:none}
  .cards{grid-template-columns:repeat(auto-fill,minmax(108px,1fr))}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
}

/* Everything that reaches innerHTML goes through esc(). API responses are
   untrusted: a company name is attacker-controllable in principle. */
function esc(v){
  if(v===null||v===undefined) return '';
  return String(v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function attr(v){ return esc(v); }

/* Strict numeric coercion. Returns null for anything not finite — never NaN,
   never 0-as-a-stand-in-for-missing. */
function num(v){
  if(v===null||v===undefined||v==='') return null;
  if(typeof v==='number') return isFinite(v)?v:null;
  var n = parseFloat(String(v).replace(/[, ]/g,''));
  return isFinite(n)?n:null;
}
function has(o,k){ return o && o[k]!==null && o[k]!==undefined && isFinite(o[k]); }

function fx(v,d){ v=num(v); return v===null?'--':v.toFixed(d===undefined?2:d); }
function sgn(v,d){ v=num(v); if(v===null) return '--'; return (v>0?'+':'')+v.toFixed(d===undefined?2:d); }
function pct(v,d){ v=num(v); return v===null?'--':v.toFixed(d===undefined?1:d)+'%'; }
function pctS(v,d){ v=num(v); return v===null?'--':(v>0?'+':'')+v.toFixed(d===undefined?1:d)+'%'; }

function money(v,cur){
  v=num(v); if(v===null) return '--';
  var s = v<0?'-':'', a=Math.abs(v), u='', d=2;
  if(a>=1e12){a/=1e12;u='T';} else if(a>=1e9){a/=1e9;u='B';}
  else if(a>=1e6){a/=1e6;u='M';} else if(a>=1e3){a/=1e3;u='K';}
  if(a>=100) d=1;
  return s+(cur?curSym(cur):'')+a.toFixed(d)+u;
}
function px(v,cur){ v=num(v); return v===null?'--':(cur?curSym(cur):'')+v.toFixed(2); }
function curSym(c){
  var m={USD:'$',EUR:'€',GBP:'£',JPY:'¥',CAD:'C$',AUD:'A$',CHF:'CHF ',INR:'₹',HKD:'HK$'};
  return m[c] || (c?c+' ':'');
}
function cls(v){ v=num(v); return v===null?'':(v>0?'pos':(v<0?'neg':'')); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function tsFmt(t){
  if(!t) return '--';
  try { return new Date(t*1000).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'}); }
  catch(e){ return String(t); }
}
function nowStamp(){ try{ return new Date().toLocaleString(); }catch(e){ return ''; } }

/* How stale is this number, in plain words. The app never implies data is
   fresher than the exchange timestamp it came with. */
function agoStr(unixSec){
  var t = num(unixSec); if(t===null||t<=0) return '';
  var s = Math.floor(Date.now()/1000 - t);
  if(s < 0) return 'just now';
  if(s < 60) return s + 's ago';
  if(s < 3600) return Math.floor(s/60) + 'm ago';
  if(s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}
function isStale(unixSec, limitSec){
  var t = num(unixSec); if(t===null||t<=0) return true;
  return (Date.now()/1000 - t) > (limitSec||300);
}

/* Nav clock, e.g. "FRI JUL 31 2026  4:12 PM" */
function clockStr(){
  try{
    var d = new Date();
    var D = ['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()];
    var M = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][d.getMonth()];
    var h = d.getHours(), ap = h>=12?'PM':'AM'; h = h%12; if(h===0) h=12;
    var mi = ('0'+d.getMinutes()).slice(-2);
    return D+' '+M+' '+('0'+d.getDate()).slice(-2)+' '+d.getFullYear()+'  '+h+':'+mi+' '+ap;
  }catch(e){ return ''; }
}

/* Heat tile colour: red at -3%, neutral at 0, green at +3%. */
function heatColor(p){
  var v = clamp(num(p)===null?0:num(p), -3, 3)/3;
  if(Math.abs(v) < 0.03) return '#3a414d';
  var a = (0.20 + 0.68*Math.abs(v)).toFixed(3);
  return v>0 ? 'rgba(47,211,95,'+a+')' : 'rgba(244,82,95,'+a+')';
}

function normKey(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,''); }
function asArr(v){ return Array.isArray(v) ? v : (v===null||v===undefined||v===''?[]:[v]); }

/* ---- filing document parsing ------------------------------------------
   SEC serves 10-Ks as HTML. Strip it to plain text, then locate the Item
   sections. No library, no PDF: PDF would need a CDN dependency, and EDGAR
   publishes HTML at the same URL anyway.                                   */
function stripHtml(html){
  var s = String(html||'');
  s = s.replace(/<(script|style)\b[^>]*>[\s\S]*?<\/\1>/gi, ' ');
  s = s.replace(/<!--[\s\S]*?-->/g, ' ');
  s = s.replace(/<\/(p|div|tr|h[1-6]|li|table)>/gi, '\n');
  s = s.replace(/<br\s*\/?>/gi, '\n');
  s = s.replace(/<[^>]+>/g, ' ');
  s = s.replace(/&nbsp;/gi, ' ').replace(/&amp;/gi, '&').replace(/&lt;/gi, '<')
       .replace(/&gt;/gi, '>').replace(/&quot;/gi, '"').replace(/&#39;|&apos;/gi, "'")
       .replace(/&#(\d+);/g, function(_,d){ try{ return String.fromCharCode(+d); }catch(e){ return ' '; } })
       .replace(/&[a-z]+;/gi, ' ');
  s = s.replace(/[ \t ]+/g, ' ').replace(/\n\s*\n\s*\n+/g, '\n\n');
  return s.trim();
}

/* A 10-K names each Item twice: once in the table of contents, once in the
   body. The TOC hits sit close together, so for each marker we keep the
   occurrence with the most text before the next marker — that is the body. */
function findSections(text){
  var markers = [];
  var re = /\bItem\s+(1A|1B|1|2|3|4|5|6|7A|7|8|9A|9B|9|10|11|12|13|14|15)\s*[.—\-:\s]/gi;
  var mt;
  while((mt = re.exec(text)) !== null){
    markers.push({id: mt[1].toUpperCase(), at: mt.index});
    if(markers.length > 400) break;
  }
  if(!markers.length) return [];
  markers.sort(function(a,b){ return a.at-b.at; });

  var out = [];
  CFG.DOC_SECTIONS.forEach(function(sec){
    var hits = markers.filter(function(x){ return x.id===sec.id; });
    if(!hits.length) return;
    var best = null;
    hits.forEach(function(h){
      var next = null;
      for(var i=0;i<markers.length;i++){
        if(markers[i].at > h.at && markers[i].id !== h.id){ next = markers[i]; break; }
      }
      var end = next ? next.at : Math.min(text.length, h.at + 40000);
      var len = end - h.at;
      if(!best || len > best.len) best = {at:h.at, end:end, len:len};
    });
    if(!best || best.len < 400) return;          // TOC-only match, no real body
    var body = text.slice(best.at, best.end).trim();
    var truncated = body.length > sec.cap;
    if(truncated) body = body.slice(0, sec.cap);
    out.push({id:sec.id, title:sec.title, text:body, chars:best.len, truncated:truncated});
  });
  return out;
}

/* Tolerant JSON extraction: strips code fences and any prose either side. */
function parseLooseJson(text){
  var s = String(text||'').trim();
  s = s.replace(/```json/gi,'').replace(/```/g,'').trim();
  var a = s.indexOf('{'), b = s.lastIndexOf('}');
  if(a===-1||b<=a) throw new Error('Model did not return JSON.');
  return JSON.parse(s.slice(a,b+1));
}

/* #overview / #signal / #valuation / #thesis / #settings — deep-linkable tabs. */
function tabFromHash(){
  try{
    var h = String((window.location && window.location.hash) || '').replace(/^#/,'').toLowerCase();
    return CFG.TABS.some(function(t){ return t.id===h; }) ? h : null;
  }catch(e){ return null; }

function setHash(id){
  try{ if(window.location && window.location.hash !== '#'+id) window.location.hash = id; }catch(e){}

function restore(){
  try{
    var d = JSON.parse(Store.get(CFG.LS_DATA)||'{}');
    if(d.ticker) State.ticker = String(d.ticker).toUpperCase();
    if(d.tab && CFG.TABS.some(function(t){return t.id===d.tab})) State.tab = d.tab;
    if(d.weights) Object.keys(CFG.DEF_WEIGHTS).forEach(function(k){
      var v=num(d.weights[k]); if(v!==null) State.weights[k]=clamp(v,0,100);
    });
    if(d.dcf) Object.keys(CFG.DEF_DCF).forEach(function(k){
      var v=num(d.dcf[k]); if(v!==null) State.dcf[k]=v;
    });
    if(d.mode && CFG.MODES.some(function(l){return l.id===d.mode})) State.mode = d.mode;
  }catch(e){}
  /* Keys live in browser storage, loaded into the module vars at boot. The
     in-file constants act only as an optional local override. */

    if(!AI_KEY      && typeof k.ai==='string')      AI_KEY      = k.ai;
  }catch(e){}

  var h = tabFromHash();
  if(h) State.tab = h;                 // an explicit #hash beats the saved tab

}

/* Single mutation entry point. */
function set(patch, opts){
  opts = opts || {};

  if(!opts.silent) render();
}

/* ==========================================================================
   4  API
   ========================================================================== */
function ApiErr(msg, code){ this.name='ApiErr'; this.message=msg; this.code=code||0; }
ApiErr.prototype = Object.create(Error.prototype);

function statusMsg(code, what){
  if(code===401||code===403) return 'Key rejected on ' + what + ' (HTTP ' + code + '). The key in section 1 of this file is wrong, revoked, or this endpoint is not on its plan.';
  if(code===429) return 'Rate limited on ' + what + ' (HTTP 429). The Finnhub free tier allows 60 calls/minute. Wait a minute, then reload.';
  if(code===404) return 'Not found on ' + what + ' (HTTP 404). Check the ticker symbol.';
  if(code>=500)  return 'Finnhub server error on ' + what + ' (HTTP ' + code + '). Nothing wrong on your side — retry shortly.';
  return 'Request to ' + what + ' failed (HTTP ' + code + ').';
}
function netMsg(what){
  return 'Could not reach ' + what + '. Check your connection. An ad-blocker or privacy extension blocking the request is the usual cause when the page is opened from a file:// path.';
}

function fhGet(path, params){
  if(!FINNHUB_KEY) return Promise.reject(new ApiErr('No Finnhub key set in section 1 of this file.',0));
  var q = Object.keys(params||{}).map(function(k){
    return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);
  });
  q.push('token='+encodeURIComponent(FINNHUB_KEY));
  var url = CFG.FH + path + '?' + q.join('&');
  return fetch(url, {method:'GET', mode:'cors', cache:'no-store'})
    .catch(function(){ throw new ApiErr(netMsg('finnhub.io'), 0); })
    .then(function(r){
      if(!r.ok) throw new ApiErr(statusMsg(r.status, path), r.status);
      return r.json().catch(function(){ throw new ApiErr('Finnhub returned a malformed response for '+path+'.', 0); });
    });
}

/* Parse one annual filing into a flat row. Field names vary by filer, so we
   match case-insensitively on substrings; first hit wins. */
function pickConcept(rows, keys){
  if(!Array.isArray(rows)) return null;
  for(var i=0;i<keys.length;i++){
    for(var j=0;j<rows.length;j++){
      var r = rows[j]; if(!r) continue;
      if(normKey(r.concept).indexOf(keys[i])>=0 || normKey(r.label).indexOf(keys[i])>=0){
        var v = num(r.value);
        if(v!==null) return v;
      }
    }
  }
  return null;
}
function parseAnnuals(payload){
  var data = (payload && Array.isArray(payload.data)) ? payload.data : [];
  var rows = data.map(function(y){
    var rep = y.report || {}, ic = rep.ic || [], cf = rep.cf || [];
    var revenue = pickConcept(ic, CFG.FIN.revenue);
    if(revenue===null) return null;                       // drop rows with no revenue
    var cfo   = pickConcept(cf, CFG.FIN.cfo);
    var capex = pickConcept(cf, CFG.FIN.capex);
    var gross = pickConcept(ic, CFG.FIN.grossProfit);
    var opInc = pickConcept(ic, CFG.FIN.opIncome);
    var ni    = pickConcept(ic, CFG.FIN.netIncome);
    return {
      year: String(y.year || (y.endDate||'').slice(0,4) || ''),
      revenue: revenue,
      grossProfit: gross,
      opIncome: opInc,
      netIncome: ni,
      eps: pickConcept(ic, CFG.FIN.eps),
      cfo: cfo,
      capex: capex,
      fcf: (cfo!==null && capex!==null) ? cfo - Math.abs(capex) : null,
      grossMargin: (gross!==null && revenue) ? gross/revenue*100 : null,
      opMargin:    (opInc!==null && revenue) ? opInc/revenue*100 : null,
      netMargin:   (ni!==null    && revenue) ? ni/revenue*100    : null
    };
  }).filter(Boolean);
  return rows.reverse();                                  // oldest first
}

/* All four calls in flight at once; partial failure degrades to warnings. */
function loadAll(sym){
  return Promise.allSettled([
    fhGet('/quote',                     {symbol:sym}),
    fhGet('/stock/profile2',            {symbol:sym}),
    fhGet('/stock/metric',              {symbol:sym, metric:'all'}),
    fhGet('/stock/financials-reported', {symbol:sym, freq:'annual'}),
    fhGet('/stock/filings',             {symbol:sym})
  ]).then(function(res){
    var warn = [], out = {quote:null, profile:null, metric:null, annuals:[], filings:[]};
    var qOk=false, mOk=false;

    if(res[0].status==='fulfilled' && res[0].value && num(res[0].value.c)!==null){
      out.quote = res[0].value; qOk = num(out.quote.c)!==null && num(out.quote.c)!==0;
      if(!qOk) warn.push('Quote came back empty for ' + sym + ' — that usually means the ticker is not recognised.');
    } else {
      warn.push('Quote: ' + (res[0].reason ? res[0].reason.message : 'failed.'));
    }

    if(res[1].status==='fulfilled' && res[1].value && Object.keys(res[1].value).length){
      out.profile = res[1].value;
    } else {
      warn.push('Company profile: ' + (res[1].reason ? res[1].reason.message : 'no data returned. Market cap and share count will be missing.'));
    }

    if(res[2].status==='fulfilled' && res[2].value && res[2].value.metric){
      out.metric = res[2].value.metric; mOk = true;
    } else {
      warn.push('Key metrics: ' + (res[2].reason ? res[2].reason.message : 'no data returned. Most ratios will be blank.'));
    }

    if(res[3].status==='fulfilled'){
      out.annuals = parseAnnuals(res[3].value);
      if(!out.annuals.length) warn.push('Annual financials returned no usable statements for ' + sym + '. History charts, revenue CAGR, EPS growth and margin trend will be unavailable.');
    } else {
      warn.push('Annual financials: ' + (res[3].reason ? res[3].reason.message : 'failed.') + ' History charts and trend factors will be unavailable.');
    }

    /* Filing index: gives every citation a real sec.gov document to point at.
       Optional — its absence weakens sourcing but breaks nothing. */
    if(res[4].status==='fulfilled' && Array.isArray(res[4].value)){
      out.filings = res[4].value;
    } else {
      warn.push('SEC filing index: ' + (res[4].reason ? res[4].reason.message : 'no data returned.') +
                ' Research citations will name the fiscal year but cannot link the source document.');
    }

    out.warnings = warn;
    out.fatal = (!qOk && !mOk)
      ? 'Could not load ' + sym + '. Both the quote and the fundamentals failed — see the messages below. If the ticker is right, you may simply be rate limited.'
      : null;
    return out;
  });
}

/* Watchlist: one quote call per symbol, failures dropped silently. */
function fetchWatchlist(){
  State.watchState = 'loading';
  return Promise.allSettled(CFG.WATCHLIST.map(function(s){
    return fhGet('/quote', {symbol:s}).then(function(q){ return {sym:s, q:q}; });
  })).then(function(res){
    var rows = [];
    res.forEach(function(r){
      if(r.status!=='fulfilled') return;
      var q = r.value.q; if(!q || num(q.c)===null || num(q.c)===0) return;
      var hi = num(q.h), lo = num(q.l), c = num(q.c);
      var pos = (hi!==null && lo!==null && hi>lo) ? (c-lo)/(hi-lo)*100 : null;
      rows.push({sym:r.value.sym, price:c, chg:num(q.d), chgPct:num(q.dp),
                 open:num(q.o), high:hi, low:lo, prev:num(q.pc), rangePos:pos});
    });
    rows.sort(function(a,b){ return (b.chgPct===null?-1e9:b.chgPct) - (a.chgPct===null?-1e9:a.chgPct); });
    State.watch = rows;
    State.watchState = rows.length ? 'ok' : 'fail';
    render();
  });
}

/* Verify before storing: a key that does not work should never be saved. */
/* Bull -> Bear -> Judge. Three sequential calls; the judge sees both memos and
   the same evidence pack, so it can catch either side inventing support. */
function apiJudge(evidence, bull, bear){
  var memo = function(tag, mode, out){
    var def = CFG.MODES.filter(function(x){ return x.id===mode; })[0];
    return tag + ' — "' + def.label + '"\n' +
      (out.answers||[]).map(function(a){
        var i = (num(a.n)||0)-1;
        return (a.n||'?') + '. ' + (def.questions[i]||'') + '\n' +
               '   ANSWER: ' + String(a.answer||'') + '\n' +
               '   CITED: ' + (asArr(a.citations).length ? asArr(a.citations).join(' | ') : 'NOTHING CITED') +
               (a.notFound ? '\n   (analyst marked this unanswerable)' : '');
      }).join('\n') +
      '\n   BOTTOM LINE: ' + String(out.bottomLine||'—') + '\n';
  };

  var prompt =
    'ROLE\n' + CFG.JUDGE_ROLE + '\n' +
    CFG.RULES + '\n' +
    'MEMO A (bull side)\n' + memo('MEMO A', 'lynch', bull) + '\n' +
    'MEMO B (bear side)\n' + memo('MEMO B', 'munger', bear) + '\n' +
    evidence.text + '\n\n' +
    'OUTPUT\nRaw JSON only — no markdown fences, no preamble. Schema:\n' +
    '{"verdict":string,"betterSupported":"bull"|"bear"|"neither",' +
    '"strongestBullPoint":string,"strongestBearPoint":string,' +
    '"overreaches":[{"side":"bull"|"bear","claim":string,"why":string}],' +
    '"bothMissed":[string],"unresolvable":[string],"whatWouldSettleIt":[string],' +
    '"evidenceQuality":string}\n\n' +
    'verdict: 3-5 sentences on which case the evidence supports and how strongly.\n' +
    'betterSupported: judged on citation quality, not persuasiveness. Use "neither" if the\n' +
    '  evidence pack is too thin to favour either side, and say so in verdict.\n' +
    'overreaches: every claim either analyst made that SOURCES does not support. Empty if none.\n' +
    'bothMissed: material facts present in SOURCES that neither memo used.\n' +
    'unresolvable: disagreements the evidence cannot settle either way.\n' +
    'evidenceQuality: one sentence on whether this pack is strong enough to decide anything.';

  return fetch(CFG.AI + '?key=' + encodeURIComponent(AI_KEY), {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      contents:[{parts:[{text: prompt}]}],
      generationConfig:{maxOutputTokens: CFG.AI_MAX_TOKENS, responseMimeType:'application/json',
                        temperature:0.2, thinkingConfig:{thinkingBudget:0}}
    })
  })
  .catch(function(){ throw new ApiErr(netMsg('generativelanguage.googleapis.com'), 0); })
  .then(function(r){
    return r.json().catch(function(){ throw new ApiErr('Malformed response from the model endpoint.',0); })
      .then(function(data){
        if(!r.ok){
          var msg = (data && data.error && data.error.message) ? data.error.message : ('HTTP ' + r.status);
          if(r.status===429 && /limit:\s*0\b/.test(msg))
            throw new ApiErr('The key works, but its Google project has no Gemini quota (free-tier "limit: 0").', 429);
          throw new ApiErr('Judge request failed: ' + msg, r.status);
        }
        var cand = data.candidates && data.candidates[0];
        if(!cand) throw new ApiErr('The model returned no content.', 0);
        var text = ((cand.content && cand.content.parts) || []).map(function(p){ return p.text||''; }).join('');
        if(!text.trim()) throw new ApiErr('The model returned an empty response.', 0);
        try { return parseLooseJson(text); }
        catch(e){ throw new ApiErr('Could not parse the judge output as JSON' +
          (cand.finishReason==='MAX_TOKENS'?' — it was cut off at the token limit.':'.'), 0); }
      });
  });
}

function verifyFinnhubKey(key){

               {method:'GET', mode:'cors', cache:'no-store'})

    .then(function(r){

      return r.json();
    })
    .then(function(j){
      if(!j || num(j.c)===null || num(j.c)===0)

      return true;

            high:hi, low:lo, prev:null,
            rangePos:(hi!==null&&lo!==null&&hi>lo)?(c-lo)/(hi-lo)*100:null};
  }).sort(function(a,b){ return (b.chgPct||-1e9)-(a.chgPct||-1e9); });
  State.notBundled = '';
  State.watchState = State.watch.length ? 'ok' : 'fail';
  State.loading = false;
  State.fatal   = null;
  State.warnings = [];
  State.metrics = computeMetrics();
  render();
}

/* Quote-only poll: one call, leaves fundamentals alone. Silent on failure —
   the on-screen timestamp simply ages, which is the honest signal. */
function refreshQuote(){
  if(State.demo) return Promise.resolve();          /* frozen snapshot */
  if(!State.metrics || State.loading) return Promise.resolve();
  return fhGet('/quote', {symbol:State.ticker}).then(function(q){
    if(!q || num(q.c)===null || num(q.c)===0) return;
    State.quote = q;
    State.metrics = computeMetrics();
    State.lastPoll = Date.now();
    /* Never yank the DOM out from under a focused field or a slider drag. */
    var a = document.activeElement;
    if(!(a && (a.tagName==='INPUT' || a.tagName==='TEXTAREA' || a.tagName==='SELECT'))) render();
  }).catch(function(){});
}

/* Build the evidence base the model is allowed to quote. Every line carries a
   bracketed id so a claim can be traced back to a specific filing field. The
   as-reported rows already hold {concept,label,value} per fiscal year, which
   is what makes real citation possible rather than vague attribution. */
function buildEvidence(m){
  var L = [], srcs = [];
  var fy = function(y){ return 'FILING-FY' + y; };

  /* filings index -> real sec.gov documents backing each fiscal year */
  var byYear = {};
  (State.filings||[]).forEach(function(f){
    if(!f || String(f.form||'').indexOf('10-K')!==0) return;
    var y = String(f.filedDate||'').slice(0,4);
    if(y && !byYear[y]) byYear[y] = f;
  });

  L.push('SOURCES — this is your complete evidence base. Cite by bracketed id.');
  L.push('');

  m.years.slice().reverse().forEach(function(y){
    var id = fy(y.year);
    /* a 10-K is filed the year after the FY ends for most filers; try both */
    var doc = byYear[String(+y.year+1)] || byYear[y.year] || null;
    srcs.push({id:id, year:y.year, form:'10-K', url:doc?doc.reportUrl:'', filed:doc?String(doc.filedDate).slice(0,10):''});
    L.push('[' + id + '] ' + (m.name||State.ticker) + ' annual report, fiscal year ' + y.year +
           (doc ? '  (10-K filed ' + String(doc.filedDate).slice(0,10) + ')' : '') );
    if(doc && doc.reportUrl) L.push('  document: ' + doc.reportUrl);
    var f = [
      ['us-gaap:Revenues', y.revenue],
      ['us-gaap:GrossProfit', y.grossProfit],
      ['us-gaap:OperatingIncomeLoss', y.opIncome],
      ['us-gaap:NetIncomeLoss', y.netIncome],
      ['us-gaap:EarningsPerShareDiluted', y.eps],
      ['us-gaap:NetCashProvidedByOperatingActivities', y.cfo],
      ['us-gaap:PaymentsToAcquirePropertyPlantAndEquipment', y.capex],
      ['derived:FreeCashFlow (cfo - |capex|)', y.fcf],
      ['derived:GrossMarginPct', y.grossMargin],
      ['derived:OperatingMarginPct', y.opMargin],
      ['derived:NetMarginPct', y.netMargin]
    ];
    f.forEach(function(p){ if(p[1]!==null && p[1]!==undefined) L.push('  ' + p[0] + ' = ' + p[1]); });
    L.push('');
  });

  L.push('[METRIC] Finnhub key metrics for ' + State.ticker + ' (vendor-computed, trailing twelve months unless noted)');
  var mk = [
    ['peTTM', m.pe], ['psTTM', m.psTTM], ['pbQuarterly', m.pb], ['beta', m.beta],
    ['dividendYieldIndicatedAnnualPct', m.divYield], ['roeTTMPct', m.roe], ['roiTTMPct', m.roi],
    ['currentRatioQuarterly', m.currentRatio], ['totalDebtToTotalEquityQuarterly', m.de],
    ['grossMarginTTMPct', m.grossMargin], ['operatingMarginTTMPct', m.opMargin],
    ['netProfitMarginTTMPct', m.netMargin], ['revenueGrowthTTMYoyPct', m.revGrowth],
    ['week52High', m.wk52High], ['week52Low', m.wk52Low],
    ['marketCapitalization', m.marketCap], ['sharesOutstanding', m.shares],
    ['revenueTTMDerived', m.revenueTTM]
  ];
  mk.forEach(function(p){ if(p[1]!==null && p[1]!==undefined) L.push('  ' + p[0] + ' = ' + p[1]); });
  srcs.push({id:'METRIC', year:'', form:'Finnhub key metrics', url:'', filed:''});
  L.push('');

  L.push('[QUOTE] Market quote for ' + State.ticker + ', exchange timestamp ' + tsFmt(m.quoteTime) +
         ' (' + agoStr(m.quoteTime) + ')');
  L.push('  price = ' + m.price);
  if(m.changePct!==null) L.push('  changePct = ' + m.changePct);
  L.push('  currency = ' + m.currency);
  srcs.push({id:'QUOTE', year:'', form:'Market quote', url:'', filed:''});
  L.push('');

  if(m.exchange || m.industry){
    L.push('[PROFILE] Company profile');
    if(m.name)     L.push('  name = ' + m.name);
    if(m.exchange) L.push('  exchange = ' + m.exchange);
    if(m.industry) L.push('  finnhubIndustry = ' + m.industry);
    srcs.push({id:'PROFILE', year:'', form:'Company profile', url:'', filed:''});
    L.push('');
  }

  /* Uploaded filing text. This is the only source that can answer questions
     about what the business does or what management says could go wrong. */
  var docChars = 0;
  (State.docs||[]).forEach(function(doc){
    doc.sections.forEach(function(s){
      if(docChars >= CFG.DOC_TOTAL_CAP) return;
      var room = CFG.DOC_TOTAL_CAP - docChars;
      var body = s.text.length > room ? s.text.slice(0, room) : s.text;
      var cut = s.truncated || body.length < s.text.length;
      docChars += body.length;
      var id = 'DOC-' + doc.tag + '-ITEM' + s.id;
      srcs.push({id:id, year:doc.fy||'', form:doc.name + ' — ' + s.title, url:doc.url||'', filed:doc.filed||''});
      L.push('[' + id + '] ' + doc.name + ' — ' + s.title +
             (doc.fy ? '  (fiscal year ' + doc.fy + ')' : ''));
      if(doc.url) L.push('  document: ' + doc.url);
      L.push('  VERBATIM TEXT FOLLOWS. Quote from it exactly when you cite it.');
      L.push('  """');
      L.push(body);
      L.push('  """');
      if(cut) L.push('  (NOTE: this section was truncated at ' + body.length +
                     ' characters of ' + s.chars + '. Text beyond that point was NOT supplied — ' +
                     'do not assume anything about it.)');
      L.push('');
    });
  });

  if(docChars){
    L.push('When citing a document section, use the form:');
    L.push('  [DOC-<tag>-ITEM<n>, section]: "exact sentence copied from the text" -> your claim');
    L.push('');
  }

  L.push('NOT IN SOURCES — you have no data on any of the following, so you may not comment on them:');
  var missing = ['segment or geographic breakdowns beyond what any quoted text states',
                 'unit volumes', 'analyst estimates', 'guidance', 'share count history',
                 'buybacks or dividends paid', 'total debt or cash balances'];
  if(!docChars) missing = missing.concat(['what the company actually does beyond an industry label',
                 'competitors', 'customer concentration', 'management commentary, MD&A or risk factors',
                 'strategy', 'products or brands']);
  L.push('  ' + missing.join(', ') + '.');
  if(!docChars){
    L.push('  Only the numeric fields above are available. No filing narrative has been supplied,');
    L.push('  so any question needing one must be answered "Not found in sources."');
  }

  return {text:L.join('\n'), sources:srcs, docChars:docChars};
}

/* --- Gemini thesis call ------------------------------------------------- */
function apiThesis(evidence){
  var mode = CFG.MODES.filter(function(x){ return x.id===State.mode; })[0] || CFG.MODES[0];
  var qs = mode.questions.map(function(q,i){ return (i+1) + '. ' + q; }).join('\n');

  var prompt =
    'ROLE\n' + mode.role.replace('[TICKER]', State.ticker) + '\n\n' +
    CFG.RULES + '\n' +
    'TASK\nAnswer these questions, in this order. Do not add, merge, reorder or skip any.\n\n' + qs + '\n\n' +
    evidence.text + '\n\n' +
    'OUTPUT\nRaw JSON only — no markdown fences, no preamble. Schema:\n' +
    '{"answers":[{"n":number,"answer":string,"citations":[string],"notFound":boolean}],' +
    '"bottomLine":string,"notFound":[string],"inferences":[string],"recencyNote":string}\n\n' +
    'answers must contain exactly ' + mode.questions.length + ' items, n = 1..' + mode.questions.length + '.\n' +
    'Each citations entry must be formatted "[SOURCE-ID, field]: value" using ids from SOURCES above.\n' +
    'Keep each quoted excerpt under 180 characters — enough to verify against the source, not a wall\n' +
    'of text. Quote the sentence that carries the point, not the paragraph around it.\n' +
    'Cite at most 3 sources per answer. Prefer one precise citation to several loose ones.\n' +
    'Set notFound true for any question SOURCES cannot answer, and say so in the answer text.\n' +
    'recencyNote: the most recent fiscal year you used, and a flag if you had to fall back to older data.';

  return fetch(CFG.AI + '?key=' + encodeURIComponent(AI_KEY), {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      contents:[{parts:[{text: prompt}]}],
      /* 2.5 is a thinking model and reasoning tokens count against
         maxOutputTokens — without this the budget is spent before any JSON
         is emitted and the response comes back truncated. */
      /* Quote-first answers run long; 2400 was sized for the old summary
         schema. Thinking stays off — reasoning tokens count against the cap. */
      generationConfig:{maxOutputTokens: CFG.AI_MAX_TOKENS, responseMimeType:'application/json',
                        temperature:0.2, thinkingConfig:{thinkingBudget:0}}
    })
  })
  .catch(function(){ throw new ApiErr(netMsg('generativelanguage.googleapis.com'), 0); })
  .then(function(r){
    return r.json().catch(function(){ throw new ApiErr('The model endpoint returned a malformed response.',0); })
      .then(function(data){
        if(!r.ok){
          var m = (data && data.error && data.error.message) ? data.error.message : ('the model endpoint returned ' + r.status);
          if(r.status===400 || r.status===401 || r.status===403)
            throw new ApiErr('Key rejected: ' + m, r.status);
          if(r.status===429){
            /* "limit: 0" is not throttling — the project has no free-tier
               quota at all, and retrying will never succeed. Say so. */
            if(/limit:\s*0\b/.test(m))
              throw new ApiErr('The key works, but its Google project has no Gemini quota (the API reports free-tier "limit: 0"). ' +
                'Retrying will not help. Either enable billing on that project, or create a fresh key at ' +
                'aistudio.google.com/apikey using "Create API key in new project", then replace AI_KEY in section 1 of this file.', 429);
            throw new ApiErr('Rate limited by the model endpoint. Wait a moment and retry. (' + m + ')', 429);
          }
          throw new ApiErr('Thesis request failed: ' + m, r.status);
        }
        var cand = data.candidates && data.candidates[0];
        if(!cand) throw new ApiErr('The model returned no content. It may have been blocked by a safety filter.', 0);
        if(cand.finishReason && cand.finishReason!=='STOP' && cand.finishReason!=='MAX_TOKENS')
          throw new ApiErr('The model stopped early (' + cand.finishReason + ').', 0);
        var parts = (cand.content && cand.content.parts) || [];
        var text = parts.map(function(p){ return p.text || ''; }).join('');
        if(!text.trim()) throw new ApiErr('The model returned an empty response.', 0);
        try { return parseLooseJson(text); }
        catch(e){ throw new ApiErr('Could not parse the model output as JSON' + (cand.finishReason==='MAX_TOKENS'?' — it was cut off at the token limit.':'.'), 0); }
      });
  });
}

/* ==========================================================================
   5  METRICS
   ========================================================================== */
function computeMetrics(){
  var q = State.quote || {}, p = State.profile || {}, k = State.metric || {}, a = State.annuals || [];
  var m = {};

  m.currency = p.currency || 'USD';
  m.name     = p.name || '';
  m.exchange = p.exchange || '';
  m.industry = p.finnhubIndustry || '';
  m.logo     = p.logo || '';
  m.ipo      = p.ipo || '';
  m.weburl   = p.weburl || '';

  m.price     = num(q.c);
  m.change    = num(q.d);
  m.changePct = num(q.dp);
  m.open      = num(q.o);
  m.high      = num(q.h);
  m.low       = num(q.l);
  m.prevClose = num(q.pc);
  m.quoteTime = num(q.t);

  /* profile2 reports both of these in MILLIONS. */
  var mc = num(p.marketCapitalization), sh = num(p.shareOutstanding);
  m.marketCap = mc===null ? null : mc*1e6;
  m.shares    = sh===null ? null : sh*1e6;
  if(m.marketCap===null && m.shares!==null && m.price!==null) m.marketCap = m.shares*m.price;
  if(m.shares===null && m.marketCap!==null && m.price) m.shares = m.marketCap/m.price;

  m.pe   = num(k.peTTM);
  m.psTTM= num(k.psTTM);
  m.pb   = num(k.pbQuarterly);
  m.beta = num(k.beta);
  m.divYield = num(k.dividendYieldIndicatedAnnual);
  m.roe  = num(k.roeTTM);
  m.roi  = num(k.roiTTM);
  m.currentRatio = num(k.currentRatioQuarterly);
  m.de   = num(k['totalDebt/totalEquityQuarterly']);     // bracket notation: contains a slash
  m.wk52High = num(k['52WeekHigh']);                      // bracket notation: starts with a digit
  m.wk52Low  = num(k['52WeekLow']);

  m.grossMargin = num(k.grossMarginTTM);
  m.opMargin    = num(k.operatingMarginTTM);
  m.netMargin   = num(k.netProfitMarginTTM);
  m.revGrowth   = num(k.revenueGrowthTTMYoy);

  /* There is no absolute revenue or FCF field on this endpoint. Derive both
     from the per-share figures and the share count. */
  m.revPerShare = num(k.revenuePerShareTTM);
  m.fcfPerShare = num(k.freeCashFlowPerShareTTM);
  m.revenueTTM  = (m.revPerShare!==null && m.shares!==null) ? m.revPerShare*m.shares : null;
  m.fcfTTM      = (m.fcfPerShare!==null && m.shares!==null) ? m.fcfPerShare*m.shares : null;

  /* ---- from annual history ---- */
  m.years = a;
  var withRev = a.filter(function(r){ return num(r.revenue)!==null && r.revenue>0; });
  if(withRev.length>=2){
    var f = withRev[0], l = withRev[withRev.length-1], n = withRev.length-1;
    m.revenueCagr = (Math.pow(l.revenue/f.revenue, 1/n) - 1) * 100;
    if(m.revGrowth===null){
      var prev = withRev[withRev.length-2];
      if(prev.revenue) m.revGrowth = (l.revenue-prev.revenue)/Math.abs(prev.revenue)*100;
    }
  } else { m.revenueCagr = null; }

  var withEps = a.filter(function(r){ return num(r.eps)!==null; });
  m.epsGrowth = null;
  if(withEps.length>=2){
    var e1 = withEps[withEps.length-1].eps, e0 = withEps[withEps.length-2].eps;
    if(e0 !== 0) m.epsGrowth = (e1-e0)/Math.abs(e0)*100;
  }

  var withOm = a.filter(function(r){ return num(r.opMargin)!==null; });
  m.marginTrend = withOm.length>=2
    ? withOm[withOm.length-1].opMargin - withOm[0].opMargin
    : null;

  if(m.grossMargin===null && withRev.length){ var lg=withRev[withRev.length-1]; if(lg.grossMargin!==null) m.grossMargin=lg.grossMargin; }
  if(m.opMargin===null && withOm.length){ m.opMargin = withOm[withOm.length-1].opMargin; }

  var withFcf = a.filter(function(r){ return num(r.fcf)!==null; });
  m.latestFcf = withFcf.length ? withFcf[withFcf.length-1].fcf : m.fcfTTM;
  m.latestFcfSource = withFcf.length ? ('FY'+withFcf[withFcf.length-1].year+' filing') : (m.fcfTTM!==null?'TTM per-share x shares':'');

  m.fcfYield = (m.latestFcf!==null && m.marketCap) ? m.latestFcf/m.marketCap*100 : null;
  m.priceToSales = m.psTTM!==null ? m.psTTM
                 : ((m.marketCap!==null && m.revenueTTM) ? m.marketCap/m.revenueTTM : null);

  return m;
}

/* ==========================================================================
   6  SIGNAL ENGINE
   ========================================================================== */
function runSignal(m, weights){
  var factors = CFG.FACTORS.map(function(f){
    /* distinct metric keys this factor depends on */
    var inputs = [];
    f.rules.forEach(function(r){ r.needs.forEach(function(n){ if(inputs.indexOf(n)<0) inputs.push(n); }); });
    var present = inputs.filter(function(n){ return has(m,n); });

    var earned = 0, possible = 0;
    var trace = f.rules.map(function(r){
      var ready = r.needs.every(function(n){ return has(m,n); });
      if(!ready){
        return {id:r.id, label:r.label, plain:r.plain, pts:r.pts, needs:r.needs, status:'nodata', earned:0, value:'no data'};
      }
      possible += r.pts;
      var fired = false;
      try { fired = !!r.test(m); } catch(e){ fired = false; }
      if(fired) earned += r.pts;
      var shown;
      try { shown = r.show(m); } catch(e){ shown = '--'; }
      return {id:r.id, label:r.label, plain:r.plain, pts:r.pts, needs:r.needs, status:fired?'hit':'miss', earned:fired?r.pts:0, value:shown};
    });

    /* Rules keyed on the same input are mutually exclusive tiers (P/E < 20 vs
       P/E 20-35), so only one can ever fire. "possible" sums them all, which
       means no company can reach 100 on such a factor. Compute the real
       ceiling so the UI can show it rather than quietly implying 100. */
    var byNeed = {}, maxAchievable = 0;
    trace.forEach(function(r){
      if(r.status==='nodata') return;
      var k = r.needs.join('|');
      byNeed[k] = Math.max(byNeed[k]||0, r.pts);
    });
    Object.keys(byNeed).forEach(function(k){ maxAchievable += byNeed[k]; });

    var coverage = inputs.length ? present.length/inputs.length : 0;
    /* Under half its inputs present -> the factor leaves the composite entirely.
       Missing data must never be scored as zeros. */
    var included  = coverage >= 0.5 && possible > 0;
    var score     = possible>0 ? earned/possible*100 : null;

    return {
      id:f.id, label:f.label, color:f.color,
      trace:trace, earned:earned, possible:possible,
      maxAchievable:maxAchievable, capped: maxAchievable>0 && maxAchievable<possible,
      score:score, included:included,
      inputs:inputs.length, present:present.length,
      missing: inputs.filter(function(n){ return !has(m,n); }),
      coverage: coverage*100,
      weight: num(weights[f.id])===null ? 0 : num(weights[f.id])
    };
  });

  var inc = factors.filter(function(f){ return f.included; });
  var wSum = inc.reduce(function(s,f){ return s+f.weight; },0);
  var composite = null;
  if(inc.length && wSum>0){
    composite = inc.reduce(function(s,f){ return s + f.score*f.weight; },0) / wSum;
  } else if(inc.length){
    composite = inc.reduce(function(s,f){ return s+f.score; },0) / inc.length; // all weights zeroed
  }

  var totIn = factors.reduce(function(s,f){ return s+f.inputs; },0);
  var totPr = factors.reduce(function(s,f){ return s+f.present; },0);

  var band = null;
  if(composite!==null){
    for(var i=0;i<CFG.BANDS.length;i++){ if(composite>=CFG.BANDS[i].min){ band=CFG.BANDS[i]; break; } }
  }

  return {
    factors:factors, composite:composite, band:band,
    included:inc.length, dropped:factors.length-inc.length,
    coverage: totIn ? totPr/totIn*100 : 0,
    inputsPresent: totPr, inputsTotal: totIn
  };
}

/* Deterministic written assessment, built only from the rules that actually
   fired and the values they tested. No model, no network, no guessing — this
   is the audit trace restated in prose, so the Thesis tab is never empty. */
function localAssessment(m, sig, dcf){
  var strengths=[], weaknesses=[], notAssessed=[], levers=[], gaps=[], superseded=[], capped=[];

  sig.factors.forEach(function(f){
    /* A missed tier whose input already satisfied a higher-scoring tier is not
       a weakness and must never become advice: "raise D/E into 1.0-2.0" when
       D/E is 0.80x would be telling you to take on debt to score better. */
    var beaten = {};
    f.trace.forEach(function(r){
      if(r.status!=='hit') return;
      var k = r.needs.join('|');
      beaten[k] = Math.max(beaten[k]||0, r.pts);
    });

    f.trace.forEach(function(r){
      var line = r.label + ' — ' + r.value;
      var plain = r.plain || r.label;
      if(r.status==='hit'){
        strengths.push({text:line, plain:plain, value:r.value, rule:r.label, pts:r.earned, factor:f.label});
      } else if(r.status==='miss'){
        var k = r.needs.join('|');
        if(beaten[k] !== undefined && beaten[k] > r.pts){
          superseded.push({text:line, plain:plain, value:r.value, rule:r.label, pts:r.pts, factor:f.label});
          return;                       // neither a weakness nor a lever
        }
        weaknesses.push({text:line, plain:plain, value:r.value, rule:r.label, pts:r.pts, factor:f.label});
        levers.push({text:'Meeting "' + r.label + '" (currently ' + r.value + ') would add ' +
          r.pts + ' points to ' + f.label + '.',
          plain: 'If it ' + plain.charAt(0).toLowerCase() + plain.slice(1) + ' — it is at ' + r.value + ' now.',
          pts:r.pts, factor:f.label});
      } else {
        notAssessed.push({text:r.label, plain:plain, factor:f.label});
      }
    });
    if(f.capped) capped.push(f.label + ' ' + (f.maxAchievable/f.possible*100).toFixed(0) + '%');
    if(!f.included) gaps.push(f.label + ' was dropped from the composite entirely — only ' +
      f.present + ' of ' + f.inputs + ' inputs were available (' + f.missing.join(', ') + ').');
    else if(f.missing.length) gaps.push(f.label + ' scored on partial data; missing: ' + f.missing.join(', ') + '.');
  });

  strengths.sort(function(a,b){ return b.pts-a.pts; });
  weaknesses.sort(function(a,b){ return b.pts-a.pts; });
  levers.sort(function(a,b){ return b.pts-a.pts; });

  /* One line beats three near-identical ones. */
  if(capped.length) gaps.push('Tiered rules are mutually exclusive, so some factors cannot reach 100 even for ' +
    'a flawless company — ceilings are ' + capped.join(', ') + '.');

  if(m.years.length && m.years.length < 3)
    gaps.push('Only ' + m.years.length + ' year(s) of annual filings parsed, so CAGR and margin-trend figures rest on a very short history.');
  if(!m.years.length)
    gaps.push('No annual filings parsed at all — every history-derived figure is unavailable.');
  if(m.latestFcfSource && m.latestFcfSource.indexOf('TTM')===0)
    gaps.push('Free cash flow came from the TTM per-share metric rather than a filing, so it is less reliable than a reported figure.');

  /* Headline: state the score and, plainly, how much of it is actually backed. */
  var head;
  if(sig.composite===null){
    head = 'No composite score could be produced for ' + State.ticker +
      ': not enough of the required inputs came back from the data provider.';
  } else {
    head = State.ticker + ' scores ' + sig.composite.toFixed(1) + ' of 100 against your configured rules, ' +
      'which places it in the ' + sig.band.label + ' band. That score is built on ' +
      sig.inputsPresent + ' of ' + sig.inputsTotal + ' available inputs (' + sig.coverage.toFixed(0) + '% coverage)' +
      (sig.dropped ? ', with ' + sig.dropped + ' factor(s) excluded for insufficient data' : '') + '. ' +
      strengths.length + ' of ' + (strengths.length+weaknesses.length) + ' scoring rules fired' +
      (superseded.length ? ' (' + superseded.length + ' lower tier(s) already beaten and excluded)' : '') + '.';
  }

  /* Valuation paragraph, strictly from the DCF result. */
  var valuation;
  if(dcf.error){
    valuation = 'No discounted cash flow value was produced. ' + dcf.error;
  } else {
    valuation = 'On your current assumptions (' + fx(dcf.assumptions.growth,1) + '% initial growth fading to ' +
      fx(dcf.assumptions.terminal,1) + '% over ' + dcf.assumptions.fade + ' years, discounted at ' +
      fx(dcf.assumptions.discount,2) + '%), the model returns ' + px(dcf.perShare, m.currency) +
      ' per share against a market price of ' + px(dcf.price, m.currency) + ' — a margin of safety of ' +
      pctS(dcf.mos,1) + '. ' +
      (dcf.tvHot
        ? 'Treat that cautiously: ' + fx(dcf.tvShare,1) + '% of the value sits in the terminal assumption, so you are pricing the assumption rather than the business.'
        : fx(dcf.tvShare,1) + '% of the value sits in the terminal assumption.') +
      ' There is no net-debt bridge, so read it as enterprise value per share.';
  }

  return {
    headline: head, valuation: valuation,
    strengths: strengths, weaknesses: weaknesses,
    notAssessed: notAssessed, levers: levers, gaps: gaps, superseded: superseded
  };
}

/* ==========================================================================
   7  DCF
   ========================================================================== */
function runDcf(m, a){
  var g0 = num(a.growth), fade = Math.round(num(a.fade)), gT = num(a.terminal), d = num(a.discount);

  if(d===null||gT===null||g0===null||!fade)
    return {error:'DCF assumptions are incomplete.'};
  if(d <= gT)
    return {error:'Discount rate (' + fx(d,1) + '%) must exceed terminal growth (' + fx(gT,1) + '%). At or below it the Gordon formula divides by zero or flips sign, and the result would be meaningless rather than merely wrong. Raise the discount rate or lower terminal growth.'};

  var fcf0 = m.latestFcf;
  if(fcf0===null)
    return {error:'No free cash flow figure available for this company, so there is nothing to discount. Annual financials and the TTM per-share FCF metric both came back empty.'};
  if(fcf0 <= 0)
    return {error:'Latest free cash flow is ' + money(fcf0, m.currency) + '. A discounted cash flow model on negative cash flow produces a negative intrinsic value that means nothing. Use a different method for this company.'};

  var shares = m.shares;
  if(!shares)
    return {error:'Share count is unavailable, so a per-share intrinsic value cannot be derived.'};

  var rows = [], fcf = fcf0, pvSum = 0;
  for(var i=1;i<=fade;i++){
    /* growth fades linearly from g0 in year 1 to gT in the final year */
    var g = fade>1 ? g0 + (gT-g0)*(i-1)/(fade-1) : gT;
    fcf = fcf * (1 + g/100);
    var disc = Math.pow(1 + d/100, i);
    var pv = fcf/disc;
    pvSum += pv;
    rows.push({year:i, growth:g, fcf:fcf, pv:pv});
  }
  var tv    = fcf * (1 + gT/100) / ((d - gT)/100);
  var pvTv  = tv / Math.pow(1 + d/100, fade);
  var ev    = pvSum + pvTv;
  var perShare = ev/shares;
  var price = m.price;
  var mos   = (price!==null && perShare>0) ? (perShare - price)/perShare*100 : null;
  var upside= (price!==null && price>0) ? (perShare/price - 1)*100 : null;
  var tvShare = ev>0 ? pvTv/ev*100 : null;

  return {
    rows:rows, pvExplicit:pvSum, tv:tv, pvTv:pvTv, ev:ev,
    perShare:perShare, price:price, mos:mos, upside:upside,
    tvShare:tvShare, tvHot: tvShare!==null && tvShare>75,
    fcf0:fcf0, shares:shares, assumptions:{growth:g0, fade:fade, terminal:gT, discount:d}
  };
}

function dcfValue(m, g0, fade, gT, d){
  var r = runDcf(m, {growth:g0, fade:fade, terminal:gT, discount:d});
  return r.error ? null : r.perShare;
}

/* 5x5: discount rate +/-2 (step 1) against terminal growth +/-1 (step 0.5). */
function sensitivityGrid(m, a){
  var ds=[], ts=[], i;
  for(i=-2;i<=2;i++) ds.push(+(num(a.discount)+i).toFixed(2));
  for(i=-2;i<=2;i++) ts.push(+(num(a.terminal)+i*0.5).toFixed(2));
  var cells = ds.map(function(d){
    return ts.map(function(t){
      var v = dcfValue(m, a.growth, Math.round(a.fade), t, d);
      var up = (v!==null && m.price) ? (v/m.price - 1)*100 : null;
      return {
        d:d, t:t, value:v, upside:up,
        cur: Math.abs(d-num(a.discount))<1e-9 && Math.abs(t-num(a.terminal))<1e-9
      };
    });
  });
  return {ds:ds, ts:ts, cells:cells};
}

/* ==========================================================================
   8  CHARTS  — hand-rolled SVG, colours read from CSS variables at draw time
   ========================================================================== */
function cssVar(name){
  try {
    var v = getComputedStyle(document.documentElement).getPropertyValue(name);
    return (v||'').trim() || '#888';
  } catch(e){ return '#888'; }
}
function niceTicks(min, max, count){
  if(!isFinite(min)||!isFinite(max)) return [0,1];
  if(min===max){ if(min===0){ min=0; max=1; } else { var p=Math.abs(min)*0.2; min-=p; max+=p; } }
  var raw = (max-min)/Math.max(1,(count||5)-1);
  if(!isFinite(raw)||raw<=0) raw = 1;
  var exp = Math.floor(Math.log(Math.abs(raw))/Math.LN10);
  var base = Math.pow(10, exp), f = raw/base;
  var step = (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*base;
  var lo = Math.floor(min/step)*step, hi = Math.ceil(max/step)*step;
  var out=[], v=lo, guard=0;
  while(v <= hi + step/1e6 && guard++<200){ out.push(Math.abs(v)<step/1e6?0:v); v+=step; }
  return out.length>1?out:[lo,lo+step];
}
function emptyChart(msg, h){
  return '<div class="mono" style="height:'+(h||180)+'px;display:flex;align-items:center;justify-content:center;'+
         'color:var(--faint);font-size:10.5px;background:var(--well);border:1px solid var(--line)">'+esc(msg)+'</div>';
}

/* comboChart(data, {bars, lines, fmtY, height})
     data  : [{label, <key>:number, ...}]
     bars  : [{key,label,color}]   grouped
     lines : [{key,label,color}]   overlaid, with dots and a last-value tag
     fmtY  : function(v) -> string  (axis + legend formatting)                 */
function comboChart(data, opt){
  opt = opt||{};
  var bars = opt.bars||[], lines = opt.lines||[], H = opt.height||250, W = 780;
  var fmtY = opt.fmtY || function(v){ return money(v); };
  if(!data || !data.length) return emptyChart(opt.empty||'No data available', H);

  var series = bars.concat(lines);
  var vals=[];
  data.forEach(function(d){ series.forEach(function(s){ var v=num(d[s.key]); if(v!==null) vals.push(v); }); });
  if(!vals.length) return emptyChart(opt.empty||'No data available', H);

  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  if(lo>0) lo = 0; if(hi<0) hi = 0;
  var ticks = niceTicks(lo, hi, 5);
  var y0v = ticks[0], y1v = ticks[ticks.length-1];

  var pad = {t: 26, r: 46, b: 26, l: 58};
  var pw = W-pad.l-pad.r, ph = H-pad.t-pad.b;
  var Y = function(v){ return pad.t + ph - (v-y0v)/((y1v-y0v)||1)*ph; };
  var band = pw/data.length;
  var groupW = band*0.62, barW = bars.length ? groupW/bars.length : 0;

  var s = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="'+attr(opt.title||'chart')+'">';
  s += '<rect x="'+pad.l+'" y="'+pad.t+'" width="'+pw+'" height="'+ph+'" fill="'+cssVar('--well')+'"/>';

  // grid + y axis
  ticks.forEach(function(t){
    var y = Y(t);
    s += '<line x1="'+pad.l+'" y1="'+y.toFixed(1)+'" x2="'+(W-pad.r)+'" y2="'+y.toFixed(1)+
         '" stroke="'+cssVar(t===0?'--line-2':'--line')+'" stroke-width="1"'+(t===0?'':' stroke-dasharray="2 3"')+'/>';
    s += '<text x="'+(pad.l-6)+'" y="'+(y+3.2).toFixed(1)+'" fill="'+cssVar('--faint')+
         '" font-size="9" text-anchor="end">'+esc(fmtY(t))+'</text>';
  });

  // bars
  bars.forEach(function(ser, si){
    var col = cssVar(ser.color);
    data.forEach(function(d,i){
      var v = num(d[ser.key]); if(v===null) return;
      var x = pad.l + i*band + (band-groupW)/2 + si*barW;
      var yv = Y(v), yz = Y(0);
      var top = Math.min(yv,yz), hgt = Math.max(1, Math.abs(yz-yv));
      s += '<rect x="'+x.toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+Math.max(1,barW-2).toFixed(1)+
           '" height="'+hgt.toFixed(1)+'" fill="'+col+'" opacity="'+(v<0?'0.55':'0.85')+'">'+
           '<title>'+esc(d.label+' '+ser.label+': '+fmtY(v))+'</title></rect>';
    });
  });

  // lines + yellow last-value tag
  lines.forEach(function(ser){
    var col = cssVar(ser.color), pts=[], dots='', last=null;
    data.forEach(function(d,i){
      var v = num(d[ser.key]); if(v===null) return;
      var cx = pad.l + i*band + band/2, cy = Y(v);
      pts.push(cx.toFixed(1)+','+cy.toFixed(1));
      last = {x:cx, y:cy, v:v};
      dots += '<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="2.6" fill="'+cssVar('--well')+
              '" stroke="'+col+'" stroke-width="1.5"><title>'+esc(d.label+' '+ser.label+': '+fmtY(v))+'</title></circle>';
    });
    if(pts.length>1) s += '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+col+'" stroke-width="1.6" stroke-linejoin="round"/>';
    s += dots;
    if(last && lines.length<=2){
      var txt = fmtY(last.v), w = Math.max(26, txt.length*5.6+8);
      s += '<rect x="'+(W-pad.r+3)+'" y="'+(last.y-7).toFixed(1)+'" width="'+w.toFixed(1)+'" height="14" fill="'+cssVar('--tag')+'"/>' +
           '<text x="'+(W-pad.r+3+w/2).toFixed(1)+'" y="'+(last.y+3.4).toFixed(1)+'" fill="#1a1505" font-size="9" font-weight="700" text-anchor="middle">'+esc(txt)+'</text>';
    }
  });

  // x labels
  data.forEach(function(d,i){
    var cx = pad.l + i*band + band/2;
    s += '<text x="'+cx.toFixed(1)+'" y="'+(H-8)+'" fill="'+cssVar('--dim')+
         '" font-size="9" text-anchor="middle">'+esc(d.label)+'</text>';
  });

  // legend
  var lx = pad.l;
  series.forEach(function(ser){
    var col = cssVar(ser.color);
    s += '<rect x="'+lx+'" y="8" width="8" height="8" fill="'+col+'" opacity="0.9"/>';
    s += '<text x="'+(lx+11)+'" y="15.5" fill="'+cssVar('--dim')+'" font-size="9">'+esc(ser.label)+'</text>';
    lx += 20 + ser.label.length*5.6;
  });

  return s + '</svg>';
}

/* radarChart(data): data = [{label, value(0-100)|null}] */
function radarChart(data){
  var S = 330, cx = S/2, cy = S/2 - 2, R = 100;
  if(!data || data.length<3) return emptyChart('Not enough factors to plot', 220);
  var n = data.length;
  var ang = function(i){ return -Math.PI/2 + i*2*Math.PI/n; };
  var P = function(i, r){ return [cx + Math.cos(ang(i))*r, cy + Math.sin(ang(i))*r]; };

  var s = '<svg class="chart" viewBox="0 0 '+S+' '+S+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="factor radar">';

  [25,50,75,100].forEach(function(lvl){
    var r = lvl/100*R, pts=[];
    for(var i=0;i<n;i++){ var p=P(i,r); pts.push(p[0].toFixed(1)+','+p[1].toFixed(1)); }
    s += '<polygon points="'+pts.join(' ')+'" fill="none" stroke="'+cssVar(lvl===100?'--line-2':'--line')+'" stroke-width="1"/>';
  });
  for(var i=0;i<n;i++){
    var p = P(i,R);
    s += '<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="'+cssVar('--line')+'" stroke-width="1"/>';
  }
  s += '<text x="'+(cx+3)+'" y="'+(cy-R+10)+'" fill="'+cssVar('--faint')+'" font-size="8.5">100</text>';

  var pts=[], dots='';
  for(var j=0;j<n;j++){
    var v = num(data[j].value);
    var r = (v===null?0:clamp(v,0,100))/100*R;
    var p = P(j,r);
    pts.push(p[0].toFixed(1)+','+p[1].toFixed(1));
    if(v!==null) dots += '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="'+cssVar('--accent')+'"/>';
  }
  var anyNull = data.some(function(d){ return num(d.value)===null; });
  s += '<polygon points="'+pts.join(' ')+'" fill="'+cssVar('--accent')+'" fill-opacity="0.18" stroke="'+cssVar('--accent')+
       '" stroke-width="1.7"'+(anyNull?' stroke-dasharray="4 3"':'')+'/>' + dots;

  for(var q=0;q<n;q++){
    var p2 = P(q, R+22), c = Math.cos(ang(q));
    var anchor = Math.abs(c)<0.3 ? 'middle' : (c>0?'start':'end');
    var v2 = num(data[q].value);
    s += '<text x="'+p2[0].toFixed(1)+'" y="'+p2[1].toFixed(1)+'" fill="'+cssVar('--dim')+
         '" font-size="9.5" text-anchor="'+anchor+'">'+esc(data[q].label)+'</text>';
    s += '<text x="'+p2[0].toFixed(1)+'" y="'+(p2[1]+11).toFixed(1)+'" fill="'+cssVar(v2===null?'--faint':'--text')+
         '" font-size="10.5" text-anchor="'+anchor+'">'+esc(v2===null?'excluded':v2.toFixed(0))+'</text>';
  }
  return s + '</svg>';
}

      }).join('') +
