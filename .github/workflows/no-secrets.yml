name: no-secrets

# Fails the build if an API key ever lands in the source. A safety net for the
# one mistake that cannot be undone by a follow-up commit.
on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Key constants must be empty
        run: |
          if grep -nE "var (FINNHUB_KEY|AI_KEY)[[:space:]]*=[[:space:]]*['\"][^'\"]+['\"]" *.html; then
            echo "::error::A key constant is non-empty. Keys belong in browser storage, never in the file."
            exit 1
          fi
          echo "key constants are empty"

      - name: No Google API key pattern
        run: |
          if grep -rnE "AIza[0-9A-Za-z_-]{30,}" --include="*.html" --include="*.md" --include="*.js" .; then
            echo "::error::Found something shaped like a Google API key."
            exit 1
          fi
          echo "no Google key pattern"

      - name: No long token literals in the key area
        run: |
          # section 1 only: the config block where keys live
          if sed -n '1,420p' stock.html | grep -nE "['\"][A-Za-z0-9_-]{32,}['\"]" | grep -vE "stockterm\.|us-gaap|netcashprovided|paymentstoacquire"; then
            echo "::error::Long token-like literal near the key configuration."
            exit 1
          fi
          echo "no stray tokens in the config block"

      - name: index.html must match stock.html
        run: |
          if ! cmp -s stock.html index.html; then
            echo "::error::index.html is out of sync with stock.html. Run: cp stock.html index.html"
            exit 1
          fi
          echo "index.html is in sync"

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Inline script must parse
        run: |
          node -e "
            const fs = require('fs'), vm = require('vm');
            const html = fs.readFileSync('stock.html', 'utf8');
            const a = html.indexOf('<script>'), b = html.lastIndexOf('</' + 'script>');
            if (a < 0 || b < 0) { console.error('no inline script found'); process.exit(1); }
            new vm.Script(html.slice(a + 8, b), { filename: 'stock.js' });
            console.log('inline script parses');
          "

      - name: No external resources
        run: |
          # the app must stay self-contained: no CDN, no remote stylesheet, no <script src>
          if grep -nE "<script[^>]+src=|<link[^>]+href=[\"']http|@import[[:space:]]+url" stock.html; then
            echo "::error::External resource reference found. This file must be self-contained."
            exit 1
          fi
          echo "no external resources"
